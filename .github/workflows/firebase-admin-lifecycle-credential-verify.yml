name: Verify Admin Lifecycle Cloud Credentials

# STRICTLY READ-ONLY VERIFICATION WORKFLOW:
# 1. NON-MUTATING AUDIT: This workflow performs strictly read-only validation of the service account
#    credentials and Cloud Functions metadata. It performs zero deployments, deletions, or mutations.
# 2. CREDENTIAL PROTECTION: Secret contents, private keys, private_key_id, and tokens are NEVER
#    printed, echoed, or exported to logs or artifacts.
# 3. PERMISSION BOUNDARY: Successful execution of this workflow verifies authentication identity
#    and read accessibility. It does NOT prove runtime deploy or delete permissions, which are
#    classified as WRITE_PERMISSION_NOT_RUNTIME_VERIFIED and DELETE_PERMISSION_NOT_RUNTIME_VERIFIED.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_cloud_credentials:
    name: Verify Service Account & Cloud Read Access
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Verify Main Branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Credential verification can only be run on the main branch."
            exit 1
          fi

      - name: Validate Service Account Credential Structure & Identity
        env:
          CREDENTIAL_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROMISEOFPLANET_BB325 }}
        run: |
          if [ -z "$CREDENTIAL_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_PROMISEOFPLANET_BB325 secret is empty or missing."
            exit 1
          fi

          node -e '
            const raw = process.env.CREDENTIAL_JSON;
            let cred;
            try {
              cred = JSON.parse(raw);
            } catch (err) {
              console.error("::error::Failed to parse credential JSON.");
              process.exit(1);
            }

            const isServiceAccount = cred && cred.type === "service_account";
            const expectedProject = "promiseofplanet-bb325";
            const expectedEmail = "github-action-promise-of-plane@promiseofplanet-bb325.iam.gserviceaccount.com";

            const projectMatch = cred && cred.project_id === expectedProject;
            const emailMatch = cred && cred.client_email === expectedEmail;
            const hasPrivateKey = cred && typeof cred.private_key === "string" && cred.private_key.length > 0;
            const hasPrivateKeyId = cred && typeof cred.private_key_id === "string" && cred.private_key_id.length > 0;

            console.log("Credential structure: " + (isServiceAccount && hasPrivateKey && hasPrivateKeyId ? "VALID" : "INVALID"));
            console.log("Expected project: " + (projectMatch ? "MATCH" : "MISMATCH"));
            console.log("Expected account identity: " + (emailMatch ? "MATCH" : "MISMATCH"));

            if (!isServiceAccount) {
              console.error("::error::Credential is not of type service_account.");
              process.exit(1);
            }

            if (!projectMatch) {
              console.error("::error::Credential project_id mismatch.");
              process.exit(1);
            }

            if (!emailMatch) {
              console.error("::error::Credential client_email mismatch.");
              process.exit(1);
            }

            if (!hasPrivateKey) {
              console.error("::error::Credential private_key is missing or empty.");
              process.exit(1);
            }

            if (!hasPrivateKeyId) {
              console.error("::error::Credential private_key_id is missing or empty.");
              process.exit(1);
            }

            console.log("Service account identity structural preflight: PASS (client_email verified).");
          '

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROMISEOFPLANET_BB325 }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Active Authenticated Identity
        run: |
          ACTIVE_ACCOUNT=$(gcloud auth list --filter=status:ACTIVE --format="value(account)")
          EXPECTED_ACCOUNT="github-action-promise-of-plane@promiseofplanet-bb325.iam.gserviceaccount.com"
          echo "Active authenticated account: $ACTIVE_ACCOUNT"
          if [ "$ACTIVE_ACCOUNT" != "$EXPECTED_ACCOUNT" ]; then
            echo "::error::Active account mismatch. Expected $EXPECTED_ACCOUNT, found $ACTIVE_ACCOUNT"
            exit 1
          fi

          ACTIVE_CONFIG_PROJECT=$(gcloud config get-value project 2>/dev/null || echo "")
          echo "Configured project (informational): $ACTIVE_CONFIG_PROJECT"

      - name: Read-Only Cloud Functions Metadata Query
        run: |
          echo "Executing read-only metadata check on project promiseofplanet-bb325 in region us-central1..."

          # Query list of Gen 2 functions (metadata only: names, state, and environment)
          FUNCTIONS_LIST=$(gcloud functions list \
            --project="promiseofplanet-bb325" \
            --regions="us-central1" \
            --format="table(name.basename(),state,environment)" 2>&1) || {
              echo "::error::Failed to list functions in us-central1. API disabled or insufficient read permissions."
              exit 1
            }

          echo "Discovered Functions summary (metadata only):"
          echo "$FUNCTIONS_LIST"

          # Describe specific known non-sensitive metadata target (listAdminUsers)
          DESCRIBE_OUTPUT=$(gcloud functions describe listAdminUsers \
            --gen2 \
            --region="us-central1" \
            --project="promiseofplanet-bb325" \
            --format="value(name,state,environment)" 2>/dev/null) || {
              STATUS=$?
              echo "::error::Mandatory metadata query failed for listAdminUsers in us-central1 (exit status $STATUS)."
              exit 1
            }

          if [ -z "$DESCRIBE_OUTPUT" ] || [ -z "$(echo "$DESCRIBE_OUTPUT" | tr -d '[:space:]')" ]; then
            echo "::error::Metadata query for listAdminUsers returned empty output."
            exit 1
          fi

          DESCRIBE_OUTPUT="$DESCRIBE_OUTPUT" node -e '
            const raw = process.env.DESCRIBE_OUTPUT;
            if (!raw || !raw.trim()) {
              console.error("::error::DESCRIBE_OUTPUT is empty.");
              process.exit(1);
            }
            const parts = raw.trim().split(/\s+/);
            const name = parts[0];
            const env = parts[2];
            const expectedName = "projects/promiseofplanet-bb325/locations/us-central1/functions/listAdminUsers";
            if (name !== expectedName) {
              console.error("::error::Resource name mismatch. Expected: " + expectedName + ", found: " + name);
              process.exit(1);
            }
            if (env !== "GEN_2") {
              console.error("::error::Environment mismatch. Expected GEN_2, found: " + env);
              process.exit(1);
            }
            console.log("Verified canonical Gen 2 metadata for target: " + name);
          '

      - name: Report IAM & Operational Boundary Status
        run: |
          echo "=========================================================="
          echo "READ-ONLY CLOUD CREDENTIAL VERIFICATION SUMMARY"
          echo "=========================================================="
          echo "Credential JSON Structure:           VALID"
          echo "GCP Project Matching:                MATCH (promiseofplanet-bb325)"
          echo "Service Account Email Matching:      MATCH (github-action-promise-of-plane@promiseofplanet-bb325.iam.gserviceaccount.com)"
          echo "Google Cloud API Authentication:     SUCCESSFUL"
          echo "Target Resource Project:             EXPLICIT (--project=promiseofplanet-bb325)"
          echo "Cloud Functions v2 Metadata Read:    SUCCESSFUL (listAdminUsers verified)"
          echo "----------------------------------------------------------"
          echo "RUNTIME PERMISSION BOUNDARIES (BY DESIGN):"
          echo "WRITE_PERMISSION_NOT_RUNTIME_VERIFIED (read-only workflow cannot test mutation)"
          echo "DELETE_PERMISSION_NOT_RUNTIME_VERIFIED (read-only workflow cannot test deletion)"
          echo "=========================================================="
