          node << 'READBACK_BINARY_EOF'
            const fs = require("node:fs");
            const mode = process.env.AV_EXECUTION_MODE;
            const fn = JSON.parse(fs.readFileSync("/tmp/binary_download_fn_post.json", "utf8"));
            if (typeof fn.name !== "string" || !fn.name.endsWith("projects/promiseofplanet-bb325/locations/us-central1/functions/libraryPublishedBinaryDownload")) {
              console.error("::error::Post-deploy libraryPublishedBinaryDownload name/region mismatch: " + String(fn.name));
              process.exit(1);
            }
            if (fn.environment !== "GEN_2") {
