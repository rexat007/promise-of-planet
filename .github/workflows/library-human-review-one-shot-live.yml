              process.exit(1);
            }
            if (fn.state !== "ACTIVE") {
              console.error("::error::Post-deploy libraryPublishedBinaryDownload state must equal \"ACTIVE\" (found: " + String(fn.state) + ").");
              process.exit(1);
            }

            const serviceConfig = fn.serviceConfig || {};
            const envVars = serviceConfig.environmentVariables || {};
            const expectedAvFlag = mode === "enabled" ? "true" : "false";
            if (envVars.POP_LIBRARY_AV_EXECUTION_ENABLED !== expectedAvFlag) {
              console.error(`::error::Post-deploy libraryPublishedBinaryDownload POP_LIBRARY_AV_EXECUTION_ENABLED mismatch with shared Firebase dotenv mode=${mode}: expected "${expectedAvFlag}", found "${String(envVars.POP_LIBRARY_AV_EXECUTION_ENABLED)}".`);
              process.exit(1);
            }
            if (mode === "disabled") {
              for (const k of ["POP_QUARANTINE_AV_JOB_PROJECT_ID", "POP_QUARANTINE_AV_JOB_REGION", "POP_QUARANTINE_AV_JOB_NAME"]) {
                if (envVars[k] !== undefined) {
                  console.error(`::error::Post-deploy libraryPublishedBinaryDownload has unexpected ${k} while av_execution_mode=disabled.`);
                  process.exit(1);
                }
              }
            } else {
              const expectedJobEnv = {
                POP_QUARANTINE_AV_JOB_PROJECT_ID: "promiseofplanet-bb325",
                POP_QUARANTINE_AV_JOB_REGION: "us-central1",
                POP_QUARANTINE_AV_JOB_NAME: "pop-library-quarantine-av-worker",
              };
              for (const [k, v] of Object.entries(expectedJobEnv)) {
                if (envVars[k] !== v) {
                  console.error(`::error::Post-deploy libraryPublishedBinaryDownload shared-dotenv mismatch for ${k}: expected "${v}", found "${String(envVars[k])}".`);
                  process.exit(1);
                }
              }
            }

            console.log(`Post-deploy readback verified libraryPublishedBinaryDownload (GEN_2, ACTIVE, us-central1, shared dotenv mode=${mode}, public download gateway enforces clean AV/PDF gates and contains zero AV job invocation handlers).`);
          READBACK_BINARY_EOF

      - name: Write Truthful One-Shot Release Summary
        if: always()
        env:
          AV_EXECUTION_MODE: ${{ inputs.av_execution_mode }}
          PREFLIGHT_OUTCOME: ${{ steps.cloud_read_only_preflight.outcome }}
          DEPLOY_OUTCOME: ${{ steps.firebase_one_shot_deploy.outcome }}
          READBACK_MANAGE_OUTCOME: ${{ steps.post_deploy_readback_manage_library.outcome }}
          READBACK_PUBLIC_OUTCOME: ${{ steps.post_deploy_readback_public_library.outcome }}
          READBACK_BINARY_OUTCOME: ${{ steps.post_deploy_readback_binary_download.outcome }}
        run: |
          set -euo pipefail
          DEPLOY_ATTEMPTED_FLAG="${DEPLOY_ATTEMPTED:-false}"
          if [ "${DEPLOY_OUTCOME}" = "success" ]; then
            DEPLOY_SUCCEEDED_LABEL="YES (firebase_one_shot_deploy outcome: success)"
          else
            DEPLOY_SUCCEEDED_LABEL="NO (firebase_one_shot_deploy outcome: ${DEPLOY_OUTCOME})"
          fi

          if [ "${DEPLOY_OUTCOME}" = "success" ] && [ "${READBACK_MANAGE_OUTCOME}" = "success" ] && [ "${READBACK_PUBLIC_OUTCOME}" = "success" ] && [ "${READBACK_BINARY_OUTCOME}" = "success" ]; then
            ALL_READBACKS_VERIFIED_LABEL="YES (manageLibraryDocuments=success, getPublicLibrary=success, libraryPublishedBinaryDownload=success)"
            OVERALL_RELEASE_STATE="LIVE_DEPLOY_AND_READBACK_SUCCEEDED_PENDING_HUMAN_ACCEPTANCE"
          elif [ "${DEPLOY_ATTEMPTED_FLAG}" != "true" ]; then
            ALL_READBACKS_VERIFIED_LABEL="NO (not executed; workflow halted in preflight before any Firebase deployment)"
            OVERALL_RELEASE_STATE="HALTED_BEFORE_DEPLOY_NO_CLOUD_MUTATION"
          else
            ALL_READBACKS_VERIFIED_LABEL="NO (manageLibraryDocuments=${READBACK_MANAGE_OUTCOME}, getPublicLibrary=${READBACK_PUBLIC_OUTCOME}, libraryPublishedBinaryDownload=${READBACK_BINARY_OUTCOME})"
            OVERALL_RELEASE_STATE="FAILED_OR_INCOMPLETE_DEPLOYMENT_DO_NOT_AUTO_RETRY"
          fi

          if [ "${AV_EXECUTION_MODE}" = "enabled" ]; then
            AV_FLAG_VALUE="true"
            AV_JOB_ENV_LABEL="SET across project-scoped Firebase dotenv (POP_QUARANTINE_AV_JOB_PROJECT_ID=promiseofplanet-bb325, POP_QUARANTINE_AV_JOB_REGION=us-central1, POP_QUARANTINE_AV_JOB_NAME=pop-library-quarantine-av-worker)"
          else
            AV_FLAG_VALUE="false"
            AV_JOB_ENV_LABEL="OMITTED (zero POP_QUARANTINE_AV_JOB_* variables written)"
          fi

          {
            echo "### Library Human Review One-Shot Release Execution Summary"
            echo ""
            echo "- **Overall Release State:** \`${OVERALL_RELEASE_STATE}\`"
            echo "- **Selected AV Execution Mode:** \`${AV_EXECUTION_MODE}\`"
            echo "- **GitHub Run ID:** \`${{ github.run_id }}\`"
            echo "- **Git Ref:** \`${{ github.ref }}\`"
            echo "- **Pinned Commit SHA:** \`${{ github.sha }}\`"
            echo "- **Target Project:** \`promiseofplanet-bb325\`"
            echo "- **Job Status:** \`${{ job.status }}\`"
            echo ""
            echo "#### Execution & Verification Truth Table"
            echo "- **Cloud Read-Only Preflight Outcome:** \`${PREFLIGHT_OUTCOME}\`"
            echo "- **Deployment Attempted:** \`${DEPLOY_ATTEMPTED_FLAG}\`"
            echo "- **Deployment Succeeded (\`functions:manageLibraryDocuments,functions:getPublicLibrary,functions:libraryPublishedBinaryDownload,hosting\`):** \`${DEPLOY_SUCCEEDED_LABEL}\`"
            echo "- **Function Readbacks Verified (\`manageLibraryDocuments\`, \`getPublicLibrary\`, \`libraryPublishedBinaryDownload\`):** \`${ALL_READBACKS_VERIFIED_LABEL}\`"
            echo "- **Verified Live Worker Image (when enabled):** \`${VERIFIED_AV_WORKER_IMAGE:-N/A}\`"
            echo "- **Verified Worker Service Account (when enabled):** \`${VERIFIED_AV_WORKER_SA:-N/A}\`"
            echo "- **Verified manageLibraryDocuments Runtime SA (when enabled):** \`${VERIFIED_MANAGE_FN_SA:-N/A}\`"
            echo "- **Firestore Location Inventory Note:** \`me-central2\` (recorded as historical Owner-verified inventory evidence; not re-queried via \`datastore.databases.getMetadata\` in CI)"
            echo ""
            echo "#### Intended Release Configuration (Applied Only When Deployment & Readback Succeed)"
            echo "- **Intended Target Resources:** \`functions:manageLibraryDocuments\`, \`functions:getPublicLibrary\`, \`functions:libraryPublishedBinaryDownload\`, \`hosting\`"
            echo "- **Shared Dotenv Note:** Firebase CLI deploys \`functions/.env.promiseofplanet-bb325\` across all deployed functions in the invocation (not isolated solely to \`manageLibraryDocuments\`); non-admin endpoints (\`getPublicLibrary\`, \`libraryPublishedBinaryDownload\`) contain zero AV job-invocation handlers and preserve public \`qcat-\` exclusion."
            echo "- **Intended Human Review & Release Flags (\`true\`):**"
            echo "  - \`VITE_LIBRARY_REVIEW_WORKBENCH_ENABLED=true\` / \`POP_LIBRARY_REVIEW_WORKBENCH_ENABLED=true\`"
            echo "  - \`VITE_LIBRARY_HUMAN_CASE_REVIEW_ENABLED=true\` / \`POP_LIBRARY_HUMAN_CASE_REVIEW_ENABLED=true\`"
            echo "  - \`VITE_LIBRARY_CATALOG_HANDOFF_ENABLED=true\` / \`POP_LIBRARY_CATALOG_HANDOFF_ENABLED=true\`"
            echo "  - \`VITE_LIBRARY_RIGHTS_DECISION_ENABLED=true\` / \`POP_LIBRARY_RIGHTS_DECISION_ENABLED=true\`"
            echo "  - \`VITE_LIBRARY_CASE_ALIGNMENT_ENABLED=true\` / \`POP_LIBRARY_CASE_ALIGNMENT_ENABLED=true\`"
            echo "  - \`VITE_LIBRARY_BINARY_SAFETY_CASE_ENABLED=true\` / \`POP_LIBRARY_BINARY_SAFETY_CASE_ENABLED=true\`"
            echo "  - \`VITE_LIBRARY_ISOLATED_INSPECTION_REQUEST_ENABLED=true\` / \`POP_LIBRARY_ISOLATED_INSPECTION_REQUEST_ENABLED=true\`"
            echo "  - \`VITE_LIBRARY_REVIEWED_SOURCE_RELEASE_ENABLED=true\` / \`POP_LIBRARY_REVIEWED_SOURCE_RELEASE_ENABLED=true\`"
            echo "  - \`VITE_LIBRARY_PUBLISHED_BINARY_RELEASE_ENABLED=true\` / \`POP_LIBRARY_PUBLISHED_BINARY_RELEASE_ENABLED=true\`"
            echo "  - \`POP_LIBRARY_PUBLISHED_BINARY_DOWNLOAD_URL=https://us-central1-promiseofplanet-bb325.cloudfunctions.net/libraryPublishedBinaryDownload\`"
            echo "- **AV Execution Gate & Invoker Env Vars:**"
            echo "  - \`VITE_LIBRARY_AV_EXECUTION_ENABLED=${AV_FLAG_VALUE}\` / \`POP_LIBRARY_AV_EXECUTION_ENABLED=${AV_FLAG_VALUE}\`"
            echo "  - \`${AV_JOB_ENV_LABEL}\`"
            echo "- **Enforced Safety Locks:**"
            echo "  - \`VITE_LIBRARY_QUARANTINE_UPLOAD_ENABLED=true\` (preserved existing endpoint)"
            echo "  - \`qcat-\` catalog drafts remain excluded from public library queries; un-scanned binaries remain blocked (\`WAITING_FOR_ACTUAL_SCAN\`); \`RESTRICTED\` prior rights decisions are never auto-cleared; published binaries (\`doc-qbin-*\`) serve strictly with \`Content-Disposition: attachment\` and immutable non-assurance flags (\`isSanitized: false\`, \`isVerifiedSafe: false\`)."
            echo ""
            echo "#### Post-Release Acceptance Notice"
            echo "- If \`Overall Release State\` is \`FAILED_OR_INCOMPLETE_DEPLOYMENT_DO_NOT_AUTO_RETRY\`, inspect the failed step logs and cloud state before taking manual action; never auto-retry."
            echo "- Even when deployment and readback succeed, CI does not prove live end-to-end acceptance or authorize automatic document publication; perform manual Owner case review, verified real-file scan, and real binary rights acceptance before testing anonymous download."
          } >> "$GITHUB_STEP_SUMMARY"
