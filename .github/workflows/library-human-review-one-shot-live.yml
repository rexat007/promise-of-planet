                POP_QUARANTINE_AV_JOB_NAME: "pop-library-quarantine-av-worker",
              };
              for (const [k, v] of Object.entries(expectedJobEnv)) {
                if (envVars[k] !== v) {
                  console.error(`::error::Post-deploy getPublicLibrary shared-dotenv mismatch for ${k}: expected "${v}", found "${String(envVars[k])}".`);
                  process.exit(1);
                }
              }
            }

            console.log(`Post-deploy readback verified getPublicLibrary (GEN_2, ACTIVE, us-central1, shared dotenv mode=${mode}, public endpoint has zero AV job invocation handlers and preserves qcat- exclusion).`);
          READBACK_PUBLIC_EOF

      - name: Post-Deploy Readback of libraryPublishedBinaryDownload (Strict GEN_2, Region, State & Shared-Dotenv Consistency)
        id: post_deploy_readback_binary_download
        env:
          AV_EXECUTION_MODE: ${{ inputs.av_execution_mode }}
