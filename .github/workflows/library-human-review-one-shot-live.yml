name: Library Human Review One-Shot Live Release (Functions + Hosting)

# GOVERNANCE & ARCHITECTURAL BOUNDARY NOTICE:
# 1. Trigger: Manual 'workflow_dispatch' ONLY on 'refs/heads/main' with explicit confirmation
#    input 'RELEASE_LIBRARY_HUMAN_REVIEW_LIVE'. Never triggers on push, pull_request, or schedule.
# 2. Scope: Releases the human quarantine-library workflow stages together in a single run:
#    - Review Workbench
#    - Human Review Case
#    - Catalog Handoff
#    - Rights Decision
#    - Catalog Case Alignment
#    - Binary Safety Case
#    - RECORD-ONLY Isolated Inspection Request
#    - Reviewed Source Release (External Publisher Link Only)
#    - Published Binary Release (Safe Direct Download Gateway for Cleanly AV-Scanned PDF/DOCX Only)
#    Default 'av_execution_mode=disabled' keeps Isolated ClamAV Execution strictly disabled
#    (VITE_LIBRARY_AV_EXECUTION_ENABLED=false, POP_LIBRARY_AV_EXECUTION_ENABLED=false) with ZERO
#    POP_QUARANTINE_AV_JOB_* env vars.
#    Explicit 'av_execution_mode=enabled' requires the separate second confirmation literal
#    'ENABLE_REAL_LIBRARY_AV_FOR_DIRECT_BINARY_RELEASE' AND fail-closed read-only verification
#    of the deployed Cloud Run Job, fresh image/signatures, Artifact Registry, dedicated quarantine
#    bucket IAM, worker Firestore IAM, and manageLibraryDocuments 'run.jobs.runWithOverrides' IAM
#    before writing transient dotenv or executing 'firebase deploy'.
# 3. Single Deployment Invocation: Executes one 'firebase deploy --project promiseofplanet-bb325
#    --only "functions:manageLibraryDocuments,functions:getPublicLibrary,functions:libraryPublishedBinaryDownload,hosting" --non-interactive'
#    command ONLY after all offline, test, build, and GCP read-only preflight checks pass.
#    Firebase CLI applies 'functions/.env.promiseofplanet-bb325' across all deployed functions in the
#    invocation (not scoped solely to manageLibraryDocuments); non-admin endpoints remain strictly
#    read-only/download-only without AV job invocation capability, and public 'qcat-' exclusion is preserved.
#    This workflow never auto-retries on partial failure and never automatically publishes documents.

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Type RELEASE_LIBRARY_HUMAN_REVIEW_LIVE to authorize the one-shot live deployment"
        required: true
        default: ""
        type: string
      av_execution_mode:
        description: "Isolated ClamAV execution mode: disabled (default) or enabled"
        required: true
        default: "disabled"
        type: choice
        options:
          - disabled
          - enabled
      confirm_av_enable:
        description: "Must be ENABLE_REAL_LIBRARY_AV_FOR_DIRECT_BINARY_RELEASE when av_execution_mode=enabled (empty when disabled)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: library-human-review-one-shot-live
  cancel-in-progress: false

jobs:
  one_shot_human_review_release:
    name: Preflight, Build, Verify & One-Shot Deploy (manageLibraryDocuments + getPublicLibrary + libraryPublishedBinaryDownload + Hosting)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 60
    env:
      FIREBASE_PROJECT_ID: promiseofplanet-bb325
      EXPECTED_FUNCTION_REGION: us-central1
      HISTORICAL_OWNER_VERIFIED_FIRESTORE_LOCATION: me-central2
      EXPECTED_QUARANTINE_BUCKET: promiseofplanet-bb325-library-quarantine
      FORBIDDEN_DEFAULT_BUCKET: promiseofplanet-bb325.firebasestorage.app
      EXPECTED_UPLOAD_ENDPOINT_URL: https://us-central1-promiseofplanet-bb325.cloudfunctions.net/libraryQuarantineUploadEndpoint
      EXPECTED_PUBLISHED_BINARY_DOWNLOAD_URL: https://us-central1-promiseofplanet-bb325.cloudfunctions.net/libraryPublishedBinaryDownload
      EXPECTED_ARTIFACT_REGISTRY_REPO: pop-quarantine-workers
      EXPECTED_AV_JOB_NAME: pop-library-quarantine-av-worker

    steps:
      - name: Verify Main Branch and Explicit Release & AV Mode Confirmation Inputs
        id: verify_branch_and_confirmation
        env:
          CONFIRM_INPUT: ${{ inputs.confirm_release }}
          AV_MODE_INPUT: ${{ inputs.av_execution_mode }}
          CONFIRM_AV_ENABLE_INPUT: ${{ inputs.confirm_av_enable }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::This workflow can only be executed from refs/heads/main (found: ${{ github.ref }})."
            exit 1
          fi
          if [ "${CONFIRM_INPUT}" != "RELEASE_LIBRARY_HUMAN_REVIEW_LIVE" ]; then
            echo "::error::Invalid confirm_release input. Must equal exact literal RELEASE_LIBRARY_HUMAN_REVIEW_LIVE."
            exit 1
          fi
          if [ "${AV_MODE_INPUT}" != "disabled" ] && [ "${AV_MODE_INPUT}" != "enabled" ]; then
            echo "::error::Invalid av_execution_mode input: ${AV_MODE_INPUT}. Must be disabled or enabled."
            exit 1
          fi
          if [ "${AV_MODE_INPUT}" = "enabled" ]; then
            if [ "${CONFIRM_AV_ENABLE_INPUT}" != "ENABLE_REAL_LIBRARY_AV_FOR_DIRECT_BINARY_RELEASE" ]; then
              echo "::error::av_execution_mode=enabled requires confirm_av_enable to equal exact literal ENABLE_REAL_LIBRARY_AV_FOR_DIRECT_BINARY_RELEASE."
              exit 1
            fi
          else
            if [ -n "${CONFIRM_AV_ENABLE_INPUT}" ]; then
              echo "::error::confirm_av_enable must be empty when av_execution_mode=disabled."
              exit 1
            fi
          fi
          echo "PINNED_JOB_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "AV_EXECUTION_MODE_RESOLVED=${AV_MODE_INPUT}" >> "$GITHUB_ENV"
          echo "Verified main branch, explicit release confirmation, and av_execution_mode=${AV_MODE_INPUT} for commit ${GITHUB_SHA}."

      - name: Checkout Pinned Repository Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify Single Commit Identity and Guard Against Tracked Dotenv Files
        id: verify_checkout_and_dotenv_guard
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${HEAD_SHA}" != "${PINNED_JOB_SHA}" ]; then
            echo "::error::Checked out HEAD (${HEAD_SHA}) does not match pinned job SHA (${PINNED_JOB_SHA})."
            exit 1
          fi
          shopt -s nullglob dotglob
          CONFLICTING_DOTENV=(
            functions/.env
            functions/.env.*
            .env
            .env.local
            .env.production
            .env.production.*
          )
          for f in "${CONFLICTING_DOTENV[@]}"; do
            if [ "$(basename "$f")" = ".env.example" ]; then
              continue
            fi
            if [ -e "$f" ]; then
              echo "::error::Conflicting dotenv file present in repository checkout before preflight: $f"
              exit 1
            fi
          done
          echo "Verified checkout HEAD=${HEAD_SHA} and absence of conflicting dotenv files."

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Existing Firebase & Editorial Image Repository Variables (Fail-Closed, No Secret Logging)
        id: validate_repo_vars
        env:
          CHECK_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          CHECK_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          CHECK_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          CHECK_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          CHECK_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          UPLOAD_URL: ${{ vars.VITE_EDITORIAL_NEWS_IMAGE_UPLOAD_URL }}
          PREVIEW_URL: ${{ vars.VITE_EDITORIAL_IMAGE_PREVIEW_URL }}
          PUBLIC_DELIVERY_URL: ${{ vars.VITE_PUBLIC_EDITORIAL_IMAGE_DELIVERY_URL }}
          LIBRARY_UPLOAD_ENABLED: ${{ vars.VITE_LIBRARY_QUARANTINE_UPLOAD_ENABLED }}
          LIBRARY_UPLOAD_ENDPOINT_URL: ${{ vars.VITE_LIBRARY_QUARANTINE_UPLOAD_ENDPOINT_URL }}
        run: |
          node -e '
            const requiredNonEmpty = [
              "CHECK_FIREBASE_API_KEY",
              "CHECK_FIREBASE_AUTH_DOMAIN",
              "CHECK_FIREBASE_PROJECT_ID",
              "CHECK_FIREBASE_APP_ID",
              "CHECK_FIREBASE_STORAGE_BUCKET",
              "UPLOAD_URL",
              "PREVIEW_URL",
              "PUBLIC_DELIVERY_URL",
              "LIBRARY_UPLOAD_ENABLED",
              "LIBRARY_UPLOAD_ENDPOINT_URL",
            ];
            for (const envKey of requiredNonEmpty) {
              const val = process.env[envKey];
              if (typeof val !== "string" || !val.trim() || val.trim() !== val || /\s/.test(val)) {
                console.error(`::error::Required repository variable mapped to ${envKey} is missing, empty, or contains whitespace.`);
                process.exit(1);
              }
            }

            if (process.env.CHECK_FIREBASE_PROJECT_ID !== "promiseofplanet-bb325") {
              console.error("::error::VITE_FIREBASE_PROJECT_ID must equal exactly \"promiseofplanet-bb325\".");
              process.exit(1);
            }

            function validateCleanHttpsUrl(raw, label) {
              if (raw.includes("?") || raw.includes("#")) {
                console.error(`::error::${label} must not include query parameters or URL fragments.`);
                process.exit(1);
              }
              let parsed;
              try {
                parsed = new URL(raw);
              } catch (err) {
                console.error(`::error::${label} is not a syntactically valid URL: ${err.message}`);
                process.exit(1);
              }
              if (
                parsed.protocol !== "https:" ||
                !parsed.hostname ||
                !parsed.hostname.includes(".") ||
                parsed.username ||
                parsed.password ||
                parsed.search ||
                parsed.hash
              ) {
                console.error(`::error::${label} must be a clean https URL without embedded credentials, query parameters, or fragments.`);
                process.exit(1);
              }
              const lowerUrl = raw.toLowerCase();
              const lowerHost = parsed.hostname.toLowerCase();
              if (
                lowerHost === "localhost" ||
                lowerHost === "127.0.0.1" ||
                lowerHost === "0.0.0.0" ||
                lowerHost === "[::1]" ||
                lowerHost.endsWith(".example.com") ||
                lowerHost === "example.com" ||
                lowerHost.endsWith(".invalid") ||
                lowerHost.endsWith(".local") ||
                lowerUrl.includes("placeholder") ||
                lowerUrl.includes("changeme") ||
                lowerUrl.includes("todo") ||
                lowerUrl.includes("<") ||
                lowerUrl.includes(">")
              ) {
                console.error(`::error::${label} must not use a placeholder, local, or invented URL.`);
                process.exit(1);
              }
            }

            validateCleanHttpsUrl(process.env.UPLOAD_URL, "VITE_EDITORIAL_NEWS_IMAGE_UPLOAD_URL");
            validateCleanHttpsUrl(process.env.PREVIEW_URL, "VITE_EDITORIAL_IMAGE_PREVIEW_URL");
            validateCleanHttpsUrl(process.env.PUBLIC_DELIVERY_URL, "VITE_PUBLIC_EDITORIAL_IMAGE_DELIVERY_URL");

            const expectedUploadEndpoint = process.env.EXPECTED_UPLOAD_ENDPOINT_URL;
            if (process.env.LIBRARY_UPLOAD_ENABLED !== "true") {
              console.error("::error::VITE_LIBRARY_QUARANTINE_UPLOAD_ENABLED must equal exactly \"true\".");
              process.exit(1);
            }
            validateCleanHttpsUrl(process.env.LIBRARY_UPLOAD_ENDPOINT_URL, "VITE_LIBRARY_QUARANTINE_UPLOAD_ENDPOINT_URL");
            if (process.env.LIBRARY_UPLOAD_ENDPOINT_URL !== expectedUploadEndpoint) {
              console.error(`::error::VITE_LIBRARY_QUARANTINE_UPLOAD_ENDPOINT_URL must equal exactly "${expectedUploadEndpoint}".`);
              process.exit(1);
            }

            console.log("Validated all required Firebase, editorial image, and quarantine upload repository variables.");
          '

      - name: Install Root and Functions Dependencies (CI Lockfile Only)
        run: |
          npm ci
          npm --prefix functions ci

      - name: Verify Lockfile-Installed tsx Binary and Package-Aware Firebase Admin SDK Resolution
        id: verify_tsx_and_firebase_admin_resolution
        run: |
          set -euo pipefail
          if [ ! -x "./node_modules/.bin/tsx" ]; then
            echo "::error::Pinned ./node_modules/.bin/tsx executable is missing after npm ci."
            exit 1
          fi
          ./node_modules/.bin/tsx --version

          node -e '
            const { createRequire } = require("node:module");
            const path = require("node:path");

            const functionsRequire =
              createRequire(path.resolve("functions/package.json"));

            const {
              initializeApp,
              applicationDefault,
              deleteApp
            } = functionsRequire("firebase-admin/app");

            const { getStorage } =
              functionsRequire("firebase-admin/storage");

            if (
              typeof initializeApp !== "function" ||
              typeof applicationDefault !== "function" ||
              typeof deleteApp !== "function" ||
              typeof getStorage !== "function"
            ) {
              console.error("::error::Package-aware resolution of firebase-admin/app or firebase-admin/storage failed to return expected functions.");
              process.exit(1);
            }

            console.log("Verified lockfile-installed ./node_modules/.bin/tsx and package-aware resolution of firebase-admin/app and firebase-admin/storage via functions/package.json.");
          '

      - name: Run Root TypeScript Check and Build Cloud Functions
        run: |
          npx tsc --noEmit
          npm --prefix functions run build

      - name: Verify Compiled Function Exports (manageLibraryDocuments, getPublicLibrary, libraryPublishedBinaryDownload), Server Release Gates, Invoker Constants, and Public qcat- Exclusion Guard
        id: verify_compiled_exports_and_guards
        run: |
          node -e '
            const fs = require("node:fs");
            const indexSource = fs.readFileSync("functions/src/index.ts", "utf8");
            if (
              !indexSource.includes("manageLibraryDocuments") ||
              !indexSource.includes("getPublicLibrary") ||
              !indexSource.includes("libraryPublishedBinaryDownload")
            ) {
              console.error("::error::functions/src/index.ts must export manageLibraryDocuments, getPublicLibrary, and libraryPublishedBinaryDownload.");
              process.exit(1);
            }

            const indexExport = require("./functions/lib/index.js");
            if (typeof indexExport.manageLibraryDocuments !== "function") {
              console.error("::error::Compiled functions/lib/index.js is missing manageLibraryDocuments function export.");
              process.exit(1);
            }
            if (typeof indexExport.getPublicLibrary !== "function") {
              console.error("::error::Compiled functions/lib/index.js is missing getPublicLibrary function export.");
              process.exit(1);
            }
            if (typeof indexExport.libraryPublishedBinaryDownload !== "function") {
              console.error("::error::Compiled functions/lib/index.js is missing libraryPublishedBinaryDownload function export.");
              process.exit(1);
            }

            const handlersMod = require("./functions/lib/library/libraryAdminHandlers.js");
            const expectedGates = [
              ["LIBRARY_REVIEW_WORKBENCH_RELEASE_ENV_VAR", "POP_LIBRARY_REVIEW_WORKBENCH_ENABLED"],
              ["LIBRARY_HUMAN_CASE_REVIEW_RELEASE_ENV_VAR", "POP_LIBRARY_HUMAN_CASE_REVIEW_ENABLED"],
              ["LIBRARY_CATALOG_HANDOFF_RELEASE_ENV_VAR", "POP_LIBRARY_CATALOG_HANDOFF_ENABLED"],
              ["LIBRARY_RIGHTS_DECISION_RELEASE_ENV_VAR", "POP_LIBRARY_RIGHTS_DECISION_ENABLED"],
              ["LIBRARY_CASE_ALIGNMENT_RELEASE_ENV_VAR", "POP_LIBRARY_CASE_ALIGNMENT_ENABLED"],
              ["LIBRARY_BINARY_SAFETY_CASE_RELEASE_ENV_VAR", "POP_LIBRARY_BINARY_SAFETY_CASE_ENABLED"],
              ["LIBRARY_ISOLATED_INSPECTION_REQUEST_RELEASE_ENV_VAR", "POP_LIBRARY_ISOLATED_INSPECTION_REQUEST_ENABLED"],
              ["LIBRARY_AV_EXECUTION_RELEASE_ENV_VAR", "POP_LIBRARY_AV_EXECUTION_ENABLED"],
              ["LIBRARY_REVIEWED_SOURCE_RELEASE_ENV_VAR", "POP_LIBRARY_REVIEWED_SOURCE_RELEASE_ENABLED"],
              ["LIBRARY_PUBLISHED_BINARY_RELEASE_ENV_VAR", "POP_LIBRARY_PUBLISHED_BINARY_RELEASE_ENABLED"],
            ];

            for (const [exportName, expectedEnvName] of expectedGates) {
              if (handlersMod[exportName] !== expectedEnvName) {
                console.error(`::error::Compiled libraryAdminHandlers.${exportName} mismatch: expected ${expectedEnvName}, found ${String(handlersMod[exportName])}`);
                process.exit(1);
              }
            }

            const invokerMod = require("./functions/lib/library/libraryQuarantineAvJobInvoker.js");
            const expectedInvokerVars = [
              ["LIBRARY_QUARANTINE_AV_JOB_PROJECT_ENV_VAR", "POP_QUARANTINE_AV_JOB_PROJECT_ID"],
              ["LIBRARY_QUARANTINE_AV_JOB_REGION_ENV_VAR", "POP_QUARANTINE_AV_JOB_REGION"],
              ["LIBRARY_QUARANTINE_AV_JOB_NAME_ENV_VAR", "POP_QUARANTINE_AV_JOB_NAME"],
              ["LIBRARY_QUARANTINE_AV_REQUEST_ID_ENV_VAR", "POP_QUARANTINE_AV_REQUEST_ID"],
            ];
            for (const [exportName, expectedEnvName] of expectedInvokerVars) {
              if (invokerMod[exportName] !== expectedEnvName) {
                console.error(`::error::Compiled libraryQuarantineAvJobInvoker.${exportName} mismatch: expected ${expectedEnvName}, found ${String(invokerMod[exportName])}`);
                process.exit(1);
              }
            }

            const pubRepoSource = fs.readFileSync("functions/src/library/publicLibraryRepository.ts", "utf8");
            if (
              !pubRepoSource.includes("isQuarantineCatalogDocumentId") ||
              !pubRepoSource.includes("!isQuarantineCatalogDocumentId(doc.id)")
            ) {
              console.error("::error::publicLibraryRepository.ts is missing the mandatory !isQuarantineCatalogDocumentId(doc.id) qcat- exclusion guard.");
              process.exit(1);
            }

            const downloadSource = fs.readFileSync("functions/src/library/libraryPublishedBinaryDownloadEndpoint.ts", "utf8");
            if (
              downloadSource.includes("GoogleCloudRunQuarantineAvJobInvoker") ||
              downloadSource.includes("invokeAvJobForRequest") ||
              pubRepoSource.includes("GoogleCloudRunQuarantineAvJobInvoker")
            ) {
              console.error("::error::Public library or published binary download endpoints must never invoke AV jobs.");
              process.exit(1);
            }

            console.log("Verified compiled manageLibraryDocuments, getPublicLibrary, and libraryPublishedBinaryDownload exports, all 10 server release gate constants, invoker env constants, and public qcat- exclusion guard.");
          '

      - name: Run Public Library & All 15 Quarantine / Human Review Backend & Client Test Suites (Pinned Local tsx)
        id: run_preflight_test_suites
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsx scripts/runLibraryQuarantineAvExecutionBackendTests.ts
          ./node_modules/.bin/tsx -e 'require("./scripts/runPublicLibraryFunctionalTests.ts")'
          ./node_modules/.bin/tsx -e 'require("./scripts/runLibraryQuarantineAdminReadTests.ts")'
          ./node_modules/.bin/tsx -e 'require("./scripts/runLibraryQuarantineReviewWorkbenchBackendTests.ts")'
          ./node_modules/.bin/tsx -e 'require("./scripts/runLibraryQuarantineReviewWorkbenchClientTests.ts")'
          ./node_modules/.bin/tsx -e 'require("./scripts/runLibraryQuarantineHumanReviewBackendTests.ts")'
          ./node_modules/.bin/tsx -e 'require("./scripts/runLibraryQuarantineHumanReviewClientTests.ts")'
          ./node_modules/.bin/tsx -e 'require("./scripts/runLibraryQuarantineCatalogHandoffBackendTests.ts")'
          ./node_modules/.bin/tsx -e 'require("./scripts/runLibraryQuarantineCatalogHandoffClientTests.ts")'
          ./node_modules/.bin/tsx -e 'require("./scripts/runLibraryQuarantineRightsDecisionBackendTests.ts")'
          ./node_modules/.bin/tsx -e 'require("./scripts/runLibraryQuarantineRightsDecisionClientTests.ts")'
          ./node_modules/.bin/tsx -e 'require("./scripts/runLibraryQuarantineCatalogCaseAlignmentBackendTests.ts")'
          ./node_modules/.bin/tsx -e 'require("./scripts/runLibraryQuarantineCatalogCaseAlignmentClientTests.ts")'
          ./node_modules/.bin/tsx -e 'require("./scripts/runLibraryQuarantineBinarySafetyCaseBackendTests.ts")'
          ./node_modules/.bin/tsx -e 'require("./scripts/runLibraryQuarantineBinarySafetyCaseClientTests.ts")'
          ./node_modules/.bin/tsx -e 'require("./scripts/runLibraryQuarantineIsolatedInspectionRequestBackendTests.ts")'
          ./node_modules/.bin/tsx -e 'require("./scripts/runLibraryQuarantineIsolatedInspectionRequestClientTests.ts")'

      - name: Build Frontend (Vite) with Explicit Human Review Release Flags and Mode-Matched AV Execution Flag
        id: build_vite_frontend
        env:
          AV_EXECUTION_MODE: ${{ inputs.av_execution_mode }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_EDITORIAL_NEWS_IMAGE_UPLOAD_URL: ${{ vars.VITE_EDITORIAL_NEWS_IMAGE_UPLOAD_URL }}
          VITE_EDITORIAL_IMAGE_PREVIEW_URL: ${{ vars.VITE_EDITORIAL_IMAGE_PREVIEW_URL }}
          VITE_PUBLIC_EDITORIAL_IMAGE_DELIVERY_URL: ${{ vars.VITE_PUBLIC_EDITORIAL_IMAGE_DELIVERY_URL }}
          VITE_LIBRARY_QUARANTINE_UPLOAD_ENABLED: "true"
          VITE_LIBRARY_QUARANTINE_UPLOAD_ENDPOINT_URL: "https://us-central1-promiseofplanet-bb325.cloudfunctions.net/libraryQuarantineUploadEndpoint"
          VITE_LIBRARY_REVIEW_WORKBENCH_ENABLED: "true"
          VITE_LIBRARY_HUMAN_CASE_REVIEW_ENABLED: "true"
          VITE_LIBRARY_CATALOG_HANDOFF_ENABLED: "true"
          VITE_LIBRARY_RIGHTS_DECISION_ENABLED: "true"
          VITE_LIBRARY_CASE_ALIGNMENT_ENABLED: "true"
          VITE_LIBRARY_BINARY_SAFETY_CASE_ENABLED: "true"
          VITE_LIBRARY_ISOLATED_INSPECTION_REQUEST_ENABLED: "true"
          VITE_LIBRARY_REVIEWED_SOURCE_RELEASE_ENABLED: "true"
          VITE_LIBRARY_PUBLISHED_BINARY_RELEASE_ENABLED: "true"
          VITE_LIBRARY_AV_EXECUTION_ENABLED: ${{ inputs.av_execution_mode == 'enabled' && 'true' || 'false' }}
        run: |
          node -e '
            const mustBeTrue = [
              "VITE_LIBRARY_QUARANTINE_UPLOAD_ENABLED",
              "VITE_LIBRARY_REVIEW_WORKBENCH_ENABLED",
              "VITE_LIBRARY_HUMAN_CASE_REVIEW_ENABLED",
              "VITE_LIBRARY_CATALOG_HANDOFF_ENABLED",
              "VITE_LIBRARY_RIGHTS_DECISION_ENABLED",
              "VITE_LIBRARY_CASE_ALIGNMENT_ENABLED",
              "VITE_LIBRARY_BINARY_SAFETY_CASE_ENABLED",
              "VITE_LIBRARY_ISOLATED_INSPECTION_REQUEST_ENABLED",
              "VITE_LIBRARY_REVIEWED_SOURCE_RELEASE_ENABLED",
              "VITE_LIBRARY_PUBLISHED_BINARY_RELEASE_ENABLED",
            ];
            for (const key of mustBeTrue) {
              if (process.env[key] !== "true") {
                console.error(`::error::Expected ${key}=true for Vite build, found ${String(process.env[key])}`);
                process.exit(1);
              }
            }
            const expectedAvFlag = process.env.AV_EXECUTION_MODE === "enabled" ? "true" : "false";
            if (process.env.VITE_LIBRARY_AV_EXECUTION_ENABLED !== expectedAvFlag) {
              console.error(`::error::VITE_LIBRARY_AV_EXECUTION_ENABLED must equal "${expectedAvFlag}" for av_execution_mode=${process.env.AV_EXECUTION_MODE} (found: ${String(process.env.VITE_LIBRARY_AV_EXECUTION_ENABLED)}).`);
              process.exit(1);
            }
            if (process.env.VITE_LIBRARY_QUARANTINE_UPLOAD_ENDPOINT_URL !== "https://us-central1-promiseofplanet-bb325.cloudfunctions.net/libraryQuarantineUploadEndpoint") {
              console.error("::error::VITE_LIBRARY_QUARANTINE_UPLOAD_ENDPOINT_URL mismatch.");
              process.exit(1);
            }
            console.log(`Verified explicit Vite release flags (9 human review/release stages=true, VITE_LIBRARY_AV_EXECUTION_ENABLED=${expectedAvFlag}, quarantine upload preserved).`);
          '
          npm run build
          if [ ! -f "dist/index.html" ]; then
            echo "::error::Vite build did not produce dist/index.html."
            exit 1
          fi

      - name: Verify Service Account Credential JSON Identity (No Secret Output)
        id: verify_service_account_credential
        env:
          CREDENTIAL_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROMISEOFPLANET_BB325 }}
        run: |
          if [ -z "$CREDENTIAL_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_PROMISEOFPLANET_BB325 secret is empty or missing."
            exit 1
          fi
          node -e '
            let cred;
            try {
              cred = JSON.parse(process.env.CREDENTIAL_JSON);
            } catch {
              console.error("::error::Failed to parse FIREBASE_SERVICE_ACCOUNT_PROMISEOFPLANET_BB325 JSON.");
              process.exit(1);
            }
            if (cred.type !== "service_account") {
              console.error("::error::Credential is not a service_account.");
              process.exit(1);
            }
            if (cred.project_id !== "promiseofplanet-bb325") {
              console.error("::error::Credential project_id mismatch. Expected promiseofplanet-bb325.");
              process.exit(1);
            }
            if (typeof cred.client_email !== "string" || !cred.client_email.endsWith(".iam.gserviceaccount.com")) {
              console.error("::error::Credential client_email is invalid.");
              process.exit(1);
            }
            if (typeof cred.private_key !== "string" || !cred.private_key.includes("BEGIN PRIVATE KEY")) {
              console.error("::error::Credential private_key is missing or malformed.");
              process.exit(1);
            }
            console.log("Verified service-account credential for project: " + cred.project_id);
          '

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROMISEOFPLANET_BB325 }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Read-Only Cloud Preflight (Strict Gen2 Function Audit, Quarantine Bucket Posture, and Conditional Live AV Worker + IAM Verification)
        id: cloud_read_only_preflight
        env:
          AV_EXECUTION_MODE: ${{ inputs.av_execution_mode }}
        run: |
          set -euo pipefail

          echo "1. Auditing existing manageLibraryDocuments Cloud Function (Strict GEN_2, ${EXPECTED_FUNCTION_REGION})..."
          gcloud functions describe manageLibraryDocuments \
            --gen2 \
            --region="${EXPECTED_FUNCTION_REGION}" \
            --project="${FIREBASE_PROJECT_ID}" \
            --format=json > /tmp/manage_library_fn_pre.json

          echo "2. Auditing existing getPublicLibrary Cloud Function (Strict GEN_2, ${EXPECTED_FUNCTION_REGION})..."
          gcloud functions describe getPublicLibrary \
            --gen2 \
            --region="${EXPECTED_FUNCTION_REGION}" \
            --project="${FIREBASE_PROJECT_ID}" \
            --format=json > /tmp/get_public_library_fn_pre.json

          echo "3. Checking existing libraryPublishedBinaryDownload Cloud Function (if already deployed)..."
          if gcloud functions describe libraryPublishedBinaryDownload \
            --gen2 \
            --region="${EXPECTED_FUNCTION_REGION}" \
            --project="${FIREBASE_PROJECT_ID}" \
            --format=json > /tmp/binary_download_fn_pre.json 2>/tmp/binary_download_fn_pre.err; then
            echo "BINARY_DOWNLOAD_PREEXISTING=true" >> "$GITHUB_ENV"
          else
            if grep -qiE "not found|404|does not exist" /tmp/binary_download_fn_pre.err; then
              echo "BINARY_DOWNLOAD_PREEXISTING=false" >> "$GITHUB_ENV"
              echo "libraryPublishedBinaryDownload does not yet exist; initial Gen2 deploy will create it."
            else
              cat /tmp/binary_download_fn_pre.err >&2
              echo "::error::Failed to inspect libraryPublishedBinaryDownload cleanly (failing closed)."
              exit 1
            fi
          fi

          node << 'PREFLIGHT_FN_EOF'
            const fs = require("node:fs");

            const allowedSystemOrReleaseEnvKeys = new Set([
              "FIREBASE_CONFIG",
              "GCLOUD_PROJECT",
              "GCP_PROJECT",
              "EVENTARC_CLOUD_EVENT_SOURCE",
              "FUNCTION_TARGET",
              "FUNCTION_SIGNATURE_TYPE",
              "K_SERVICE",
              "K_REVISION",
              "K_CONFIGURATION",
              "PORT",
              "NODE_ENV",
              "FUNCTION_REGION",
              "FIREBASE_DEBUG_MODE",
              "FIREBASE_DEBUG_FEATURES",
              "LOG_EXECUTION_ID",
              "POP_LIBRARY_REVIEW_WORKBENCH_ENABLED",
              "POP_LIBRARY_HUMAN_CASE_REVIEW_ENABLED",
              "POP_LIBRARY_CATALOG_HANDOFF_ENABLED",
              "POP_LIBRARY_RIGHTS_DECISION_ENABLED",
              "POP_LIBRARY_CASE_ALIGNMENT_ENABLED",
              "POP_LIBRARY_BINARY_SAFETY_CASE_ENABLED",
              "POP_LIBRARY_ISOLATED_INSPECTION_REQUEST_ENABLED",
              "POP_LIBRARY_REVIEWED_SOURCE_RELEASE_ENABLED",
              "POP_LIBRARY_PUBLISHED_BINARY_RELEASE_ENABLED",
              "POP_LIBRARY_PUBLISHED_BINARY_DOWNLOAD_URL",
              "POP_LIBRARY_AV_EXECUTION_ENABLED",
              "POP_QUARANTINE_AV_JOB_PROJECT_ID",
              "POP_QUARANTINE_AV_JOB_REGION",
              "POP_QUARANTINE_AV_JOB_NAME",
            ]);

            function auditExistingGen2Function(jsonPath, expectedFunctionName, requireGeminiSecret) {
              const fn = JSON.parse(fs.readFileSync(jsonPath, "utf8"));
              const expectedSuffix = `projects/promiseofplanet-bb325/locations/us-central1/functions/${expectedFunctionName}`;
              if (typeof fn.name !== "string" || !fn.name.endsWith(expectedSuffix)) {
                console.error(`::error::Unexpected ${expectedFunctionName} resource name or region: ${String(fn.name)}`);
                process.exit(1);
              }
              if (fn.environment !== "GEN_2") {
                console.error(`::error::${expectedFunctionName} environment must strictly equal "GEN_2" (found: ${String(fn.environment)}).`);
                process.exit(1);
              }
              if (fn.state !== "ACTIVE") {
                console.error(`::error::${expectedFunctionName} state must equal "ACTIVE" before release (found: ${String(fn.state)}).`);
                process.exit(1);
              }

              const serviceConfig = fn.serviceConfig || {};
              const secretEnvVars = Array.isArray(serviceConfig.secretEnvironmentVariables)
                ? serviceConfig.secretEnvironmentVariables
                : [];

              if (requireGeminiSecret) {
                const hasGeminiSecret = secretEnvVars.some((s) => s && s.key === "GEMINI_API_KEY");
                if (!hasGeminiSecret) {
                  console.error(`::error::Existing ${expectedFunctionName} is missing expected GEMINI_API_KEY secret binding.`);
                  process.exit(1);
                }
              }

              const envVars = serviceConfig.environmentVariables && typeof serviceConfig.environmentVariables === "object"
                ? serviceConfig.environmentVariables
                : {};
              const envKeys = Object.keys(envVars);

              if (Object.prototype.hasOwnProperty.call(envVars, "LOG_EXECUTION_ID")) {
                if (envVars.LOG_EXECUTION_ID !== "true") {
                  console.error(
                    `::error::STOP BEFORE DEPLOY: Existing ${expectedFunctionName} has a non-default or malformed LOG_EXECUTION_ID configuration (expected Firebase CLI-managed default "true").`
                  );
                  process.exit(1);
                }
              }

              const unrecognizedCustomKeys = envKeys.filter(
                (k) => !allowedSystemOrReleaseEnvKeys.has(k) && !k.startsWith("FIREBASE_") && !k.startsWith("X_GOOGLE_")
              );

              console.log(`Existing ${expectedFunctionName} state=${fn.state}, environment=${fn.environment}, serviceAccount=${String(serviceConfig.serviceAccountEmail || "(missing)")}`);
              console.log(`Existing ${expectedFunctionName} secret binding keys: ${secretEnvVars.length ? secretEnvVars.map((s) => s.key).join(", ") : "(none)"}`);
              console.log(`Existing ${expectedFunctionName} runtime env keys: ${envKeys.length ? envKeys.join(", ") : "(none)"}`);

              if (unrecognizedCustomKeys.length > 0) {
                console.error(
                  `::error::STOP BEFORE DEPLOY: Existing ${expectedFunctionName} has custom runtime environment variable(s) that could be overwritten by dotenv deployment: ` +
                  unrecognizedCustomKeys.join(", ")
                );
                process.exit(1);
              }
              return fn;
            }

            auditExistingGen2Function("/tmp/manage_library_fn_pre.json", "manageLibraryDocuments", true);
            auditExistingGen2Function("/tmp/get_public_library_fn_pre.json", "getPublicLibrary", false);
            if (process.env.BINARY_DOWNLOAD_PREEXISTING === "true") {
              auditExistingGen2Function("/tmp/binary_download_fn_pre.json", "libraryPublishedBinaryDownload", false);
            }
          PREFLIGHT_FN_EOF

          echo "4. Firestore (default) database location note: Historically verified by Project Owner as ${HISTORICAL_OWNER_VERIFIED_FIRESTORE_LOCATION} (not re-queried via datastore.databases.getMetadata in CI)."

          echo "5. Auditing dedicated quarantine bucket (${EXPECTED_QUARANTINE_BUCKET}) posture (Fail-Closed)..."
          node << 'PREFLIGHT_BUCKET_EOF'
            const { createRequire } = require("node:module");
            const path = require("node:path");

            const functionsRequire =
              createRequire(path.resolve("functions/package.json"));

            const {
              initializeApp,
              applicationDefault,
              deleteApp
            } = functionsRequire("firebase-admin/app");

            const { getStorage } =
              functionsRequire("firebase-admin/storage");

            (async () => {
              const targetBucketName = process.env.EXPECTED_QUARANTINE_BUCKET;
              const forbiddenDefaultBucket = process.env.FORBIDDEN_DEFAULT_BUCKET;
              if (!targetBucketName || targetBucketName === forbiddenDefaultBucket) {
                console.error("::error::Invalid quarantine bucket configuration.");
                process.exit(1);
              }

              const app = initializeApp(
                { credential: applicationDefault(), projectId: "promiseofplanet-bb325" },
                "one-shot-preflight-bucket-verify"
              );
              try {
                const bucket = getStorage(app).bucket(targetBucketName);
                const [exists] = await bucket.exists();
                if (exists !== true) {
                  console.error("::error::Dedicated quarantine bucket does not exist: " + targetBucketName);
                  process.exit(1);
                }
                const [metadata] = await bucket.getMetadata();
                if (!metadata || metadata.name !== targetBucketName) {
                  console.error("::error::Bucket metadata missing or bucket name mismatch.");
                  process.exit(1);
                }
                const iamConfig = metadata.iamConfiguration || {};
                const ubla = Boolean(
                  iamConfig.uniformBucketLevelAccess &&
                  iamConfig.uniformBucketLevelAccess.enabled === true
                );
                if (!ubla) {
                  console.error("::error::UBLA is not enabled on " + targetBucketName);
                  process.exit(1);
                }
                if (iamConfig.publicAccessPrevention !== "enforced") {
                  console.error("::error::Public Access Prevention is not enforced on " + targetBucketName);
                  process.exit(1);
                }
                const [policy] = await bucket.iam.getPolicy({ requestedPolicyVersion: 3 });
                if (!policy || typeof policy !== "object" || !Array.isArray(policy.bindings)) {
                  console.error("::error::Bucket IAM policy returned an invalid, missing, or non-array bindings structure (failing closed).");
                  process.exit(1);
                }
                for (const b of policy.bindings) {
                  if (!b || typeof b !== "object" || !Array.isArray(b.members)) {
                    console.error("::error::Bucket IAM policy binding entry is malformed or missing members array (failing closed).");
                    process.exit(1);
                  }
                  for (const member of b.members) {
                    const norm = String(member).trim().toLowerCase();
                    if (
                      norm === "allusers" ||
                      norm === "allauthenticatedusers" ||
                      norm.startsWith("allusers:") ||
                      norm.startsWith("allauthenticatedusers:") ||
                      norm.startsWith("domain:")
                    ) {
                      console.error("::error::Forbidden public IAM principal on quarantine bucket: " + member);
                      process.exit(1);
                    }
                  }
                }
                console.log("Verified dedicated quarantine bucket exists, UBLA=true, PAP=enforced, and fail-closed non-public IAM across " + policy.bindings.length + " binding(s).");
              } finally {
                await deleteApp(app);
              }
            })().catch((err) => {
              console.error("::error::Quarantine bucket read-only check failed (failing closed): " + (err && err.message ? err.message : String(err)));
              process.exit(1);
            });
          PREFLIGHT_BUCKET_EOF

          if [ "${AV_EXECUTION_MODE}" = "enabled" ]; then
            echo "6. Verifying live Cloud Run AV Worker, Artifact Registry image freshness (<=7d), and IAM (av_execution_mode=enabled)..."
            node << 'PREFLIGHT_AV_ENABLE_EOF'
              const fs = require("node:fs");
              const { execFileSync } = require("node:child_process");

              const PROJECT_ID = process.env.FIREBASE_PROJECT_ID;
              const REGION = process.env.EXPECTED_FUNCTION_REGION;
              const AR_REPO = process.env.EXPECTED_ARTIFACT_REGISTRY_REPO;
              const JOB_NAME = process.env.EXPECTED_AV_JOB_NAME;
              const BUCKET_NAME = process.env.EXPECTED_QUARANTINE_BUCKET;
              const FORBIDDEN_BUCKET = process.env.FORBIDDEN_DEFAULT_BUCKET;

              function runGcloudOrFail(args, label) {
                try {
                  return execFileSync("gcloud", args, { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] });
                } catch (err) {
                  const stderr = err && err.stderr ? String(err.stderr) : String(err && err.message ? err.message : err);
                  console.error(`::error::STOP BEFORE DEPLOY (${label} failed closed): ${stderr}`);
                  process.exit(1);
                }
              }

              function classifyGcloudError(stderr) {
                const raw = typeof stderr === "string" ? stderr : String(stderr || "");
                const lower = raw.toLowerCase();
                if (
                  lower.includes("permission_denied") ||
                  lower.includes("permission denied") ||
                  lower.includes("permission") ||
                  /\b403\b/.test(lower) ||
                  lower.includes("unauthorized") ||
                  lower.includes("unauthenticated") ||
                  lower.includes("forbidden")
                ) {
                  return "PERMISSION_DENIED";
                }
                if (
                  /\bnot_found\b/i.test(raw) ||
                  lower.includes("cannot find job") ||
                  lower.includes("not found") ||
                  /\b404\b/.test(lower) ||
                  lower.includes("does not exist")
                ) {
                  return "NOT_FOUND";
                }
                return "ERROR";
              }

              function parseStrictV1TimeoutSeconds(raw) {
                if (typeof raw === "number") {
                  return Number.isSafeInteger(raw) && raw >= 0 ? raw : null;
                }
                if (typeof raw === "string") {
                  if (!/^(0|[1-9]\d*)$/.test(raw)) return null;
                  const n = Number(raw);
                  return Number.isSafeInteger(n) && String(n) === raw ? n : null;
                }
                return null;
              }

              function normalizeCloudRunJob(jobJson, expected) {
                if (!jobJson || typeof jobJson !== "object" || Array.isArray(jobJson)) {
                  return { ok: false, error: "Cloud Run Job JSON is not an object" };
                }
                const hasV1Top =
                  jobJson.apiVersion !== undefined ||
                  jobJson.kind !== undefined ||
                  jobJson.metadata !== undefined ||
                  jobJson.spec !== undefined;
                const hasV2Top =
                  jobJson.name !== undefined ||
                  jobJson.template !== undefined ||
                  jobJson.conditions !== undefined;
                if (hasV1Top && hasV2Top) {
                  return { ok: false, error: "Mixed Cloud Run v1 and v2 schema fields detected" };
                }
                if (!hasV1Top && !hasV2Top) {
                  return { ok: false, error: "Unknown or empty Cloud Run Job schema" };
                }

                if (hasV1Top) {
                  if (jobJson.apiVersion !== "run.googleapis.com/v1") {
                    return { ok: false, error: `Unsupported Cloud Run v1 apiVersion=${String(jobJson.apiVersion)}` };
                  }
                  if (jobJson.kind !== "Job") {
                    return { ok: false, error: `Unsupported Cloud Run v1 kind=${String(jobJson.kind)}` };
                  }
                  const md = jobJson.metadata;
                  if (!md || typeof md !== "object" || Array.isArray(md)) {
                    return { ok: false, error: "Cloud Run v1 job.metadata missing" };
                  }
                  if (typeof md.name !== "string" || md.name !== expected.jobName) {
                    return { ok: false, error: `Cloud Run v1 metadata.name mismatch: expected ${expected.jobName}, found ${String(md.name)}` };
                  }
                  const labels = md.labels && typeof md.labels === "object" && !Array.isArray(md.labels) ? md.labels : null;
                  if (labels && typeof labels["cloud.googleapis.com/location"] === "string" && labels["cloud.googleapis.com/location"] !== expected.region) {
                    return { ok: false, error: `Cloud Run v1 metadata location mismatch: ${labels["cloud.googleapis.com/location"]}` };
                  }
                  if (typeof md.selfLink === "string" && md.selfLink.length > 0) {
                    const locMatch = /\/locations\/([^/?]+)/.exec(md.selfLink);
                    if (locMatch && locMatch[1] !== expected.region) {
                      return { ok: false, error: `Cloud Run v1 metadata.selfLink region mismatch: ${locMatch[1]}` };
                    }
                    const jobMatch = /\/jobs\/([^/?]+)/.exec(md.selfLink);
                    if (jobMatch && jobMatch[1] !== expected.jobName) {
                      return { ok: false, error: `Cloud Run v1 metadata.selfLink job mismatch: ${jobMatch[1]}` };
                    }
                  }
                  const spec = jobJson.spec;
                  const execTpl = spec && typeof spec === "object" && !Array.isArray(spec) ? spec.template : null;
                  const execSpec = execTpl && typeof execTpl === "object" && !Array.isArray(execTpl) ? execTpl.spec : null;
                  if (!execSpec || typeof execSpec !== "object" || Array.isArray(execSpec)) {
                    return { ok: false, error: "Cloud Run v1 job.spec.template.spec missing" };
                  }
                  if (typeof execSpec.taskCount !== "number" || !Number.isInteger(execSpec.taskCount)) {
                    return { ok: false, error: `Cloud Run v1 invalid spec.template.spec.taskCount=${String(execSpec.taskCount)}` };
                  }
                  const podTpl = execSpec.template;
                  const podSpec = podTpl && typeof podTpl === "object" && !Array.isArray(podTpl) ? podTpl.spec : null;
                  if (!podSpec || typeof podSpec !== "object" || Array.isArray(podSpec)) {
                    return { ok: false, error: "Cloud Run v1 job.spec.template.spec.template.spec missing" };
                  }
                  if (podSpec.serviceAccount !== undefined || podSpec.timeout !== undefined) {
                    return { ok: false, error: "Mixed v2 fields inside Cloud Run v1 pod spec" };
                  }
                  if (typeof podSpec.serviceAccountName !== "string") {
                    return { ok: false, error: "Cloud Run v1 serviceAccountName missing" };
                  }
                  if (typeof podSpec.maxRetries !== "number" || !Number.isInteger(podSpec.maxRetries)) {
                    return { ok: false, error: `Cloud Run v1 invalid maxRetries=${String(podSpec.maxRetries)}` };
                  }
                  const parsedTimeoutSeconds = parseStrictV1TimeoutSeconds(podSpec.timeoutSeconds);
                  if (parsedTimeoutSeconds === null) {
                    return { ok: false, error: `Cloud Run v1 invalid timeoutSeconds=${String(podSpec.timeoutSeconds)}` };
                  }
                  if (!Array.isArray(podSpec.containers) || podSpec.containers.length !== 1 || !podSpec.containers[0] || typeof podSpec.containers[0] !== "object" || Array.isArray(podSpec.containers[0])) {
                    return { ok: false, error: "Cloud Run v1 containers missing, empty, or invalid" };
                  }
                  let readyIssue = null;
                  const conditions = jobJson.status && Array.isArray(jobJson.status.conditions) ? jobJson.status.conditions : [];
                  const readyCond = conditions.find((c) => c && c.type === "Ready");
                  if (readyCond && readyCond.status && readyCond.status !== "True") {
                    readyIssue = `Cloud Run v1 Ready condition is not True (found: ${String(readyCond.status)})`;
                  }
                  return {
                    ok: true,
                    schemaVersion: "v1",
                    jobIdentifier: md.name,
                    taskCount: execSpec.taskCount,
                    serviceAccount: podSpec.serviceAccountName.trim(),
                    maxRetries: podSpec.maxRetries,
                    timeoutSeconds: parsedTimeoutSeconds,
                    containers: podSpec.containers,
                    readyIssue,
                  };
                }

                const expectedV2Name = `projects/${expected.projectId}/locations/${expected.region}/jobs/${expected.jobName}`;
                if (typeof jobJson.name !== "string" || jobJson.name !== expectedV2Name) {
                  return { ok: false, error: `Cloud Run v2 name/project/region mismatch: expected ${expectedV2Name}, found ${String(jobJson.name)}` };
                }
                const tpl = jobJson.template;
                if (!tpl || typeof tpl !== "object" || Array.isArray(tpl)) {
                  return { ok: false, error: "Cloud Run v2 job.template missing" };
                }
                if (tpl.spec !== undefined) {
                  return { ok: false, error: "Mixed v1 spec inside Cloud Run v2 job.template" };
                }
                if (typeof tpl.taskCount !== "number" || !Number.isInteger(tpl.taskCount)) {
                  return { ok: false, error: `Cloud Run v2 invalid template.taskCount=${String(tpl.taskCount)}` };
                }
                const podTpl = tpl.template;
                if (!podTpl || typeof podTpl !== "object" || Array.isArray(podTpl)) {
                  return { ok: false, error: "Cloud Run v2 job.template.template missing" };
                }
                if (podTpl.spec !== undefined || podTpl.serviceAccountName !== undefined || podTpl.timeoutSeconds !== undefined) {
                  return { ok: false, error: "Mixed v1 fields inside Cloud Run v2 pod template" };
                }
                if (typeof podTpl.serviceAccount !== "string") {
                  return { ok: false, error: "Cloud Run v2 template.template.serviceAccount missing" };
                }
                if (typeof podTpl.maxRetries !== "number" || !Number.isInteger(podTpl.maxRetries)) {
                  return { ok: false, error: `Cloud Run v2 invalid maxRetries=${String(podTpl.maxRetries)}` };
                }
                if (typeof podTpl.timeout !== "string" || !/^\d+s$/.test(podTpl.timeout)) {
                  return { ok: false, error: `Cloud Run v2 invalid timeout=${String(podTpl.timeout)}` };
                }
                if (!Array.isArray(podTpl.containers) || podTpl.containers.length !== 1 || !podTpl.containers[0] || typeof podTpl.containers[0] !== "object" || Array.isArray(podTpl.containers[0])) {
                  return { ok: false, error: "Cloud Run v2 containers missing, empty, or invalid" };
                }
                let readyIssue = null;
                const conditions = Array.isArray(jobJson.conditions) ? jobJson.conditions : [];
                const readyCond = conditions.find((c) => c && c.type === "Ready");
                if (readyCond && readyCond.state && readyCond.state !== "CONDITION_SUCCEEDED") {
                  readyIssue = `Cloud Run v2 Ready condition is not CONDITION_SUCCEEDED (found: ${String(readyCond.state)})`;
                }
                return {
                  ok: true,
                  schemaVersion: "v2",
                  jobIdentifier: jobJson.name,
                  taskCount: tpl.taskCount,
                  serviceAccount: podTpl.serviceAccount.trim(),
                  maxRetries: podTpl.maxRetries,
                  timeoutSeconds: Number(podTpl.timeout.slice(0, -1)),
                  containers: podTpl.containers,
                  readyIssue,
                };
              }

              // 6a. Required APIs
              const enabledSvcs = JSON.parse(runGcloudOrFail(["services", "list", "--enabled", `--project=${PROJECT_ID}`, "--format=json"], "services list"));
              const enabledSet = new Set(enabledSvcs.map((s) => (s && s.config && s.config.name ? s.config.name : s && s.name ? String(s.name).split("/").pop() : "")));
              for (const api of ["run.googleapis.com", "artifactregistry.googleapis.com", "firestore.googleapis.com", "storage.googleapis.com"]) {
                if (!enabledSet.has(api)) {
                  console.error(`::error::STOP BEFORE DEPLOY: Required API ${api} is not enabled on ${PROJECT_ID}.`);
                  process.exit(1);
                }
              }

              // 6b. Artifact Registry repo
              const arRepo = JSON.parse(runGcloudOrFail(["artifacts", "repositories", "describe", AR_REPO, `--location=${REGION}`, `--project=${PROJECT_ID}`, "--format=json"], "artifacts repo describe"));
              if (arRepo.format !== "DOCKER") {
                console.error(`::error::STOP BEFORE DEPLOY: Artifact Registry repo ${AR_REPO} must be DOCKER format.`);
                process.exit(1);
              }

              // 6c. Cloud Run Job describe & security checks (strict v1 / v2 schema normalization)
              const job = JSON.parse(runGcloudOrFail(["run", "jobs", "describe", JOB_NAME, `--region=${REGION}`, `--project=${PROJECT_ID}`, "--format=json"], "run jobs describe"));
              const normJob = normalizeCloudRunJob(job, {
                projectId: PROJECT_ID,
                region: REGION,
                jobName: JOB_NAME,
              });
              if (!normJob.ok) {
                console.error(`::error::STOP BEFORE DEPLOY: Cloud Run Job schema/identity check failed: ${normJob.error}`);
                process.exit(1);
              }
              if (normJob.readyIssue) {
                console.error(`::error::STOP BEFORE DEPLOY: ${normJob.readyIssue}`);
                process.exit(1);
              }

              const c0 = normJob.containers[0];
              const workerSa = normJob.serviceAccount;
              const manageFn = JSON.parse(fs.readFileSync("/tmp/manage_library_fn_pre.json", "utf8"));
              const manageFnSa = manageFn && manageFn.serviceConfig && typeof manageFn.serviceConfig.serviceAccountEmail === "string"
                ? manageFn.serviceConfig.serviceAccountEmail.trim()
                : "";

              if (
                !/^[a-z0-9][a-z0-9-]{4,28}[a-z0-9]@promiseofplanet-bb325\.iam\.gserviceaccount\.com$/.test(workerSa) ||
                workerSa.endsWith("@appspot.gserviceaccount.com") ||
                workerSa.includes("-compute@developer.gserviceaccount.com") ||
                workerSa.startsWith("firebase-adminsdk-")
              ) {
                console.error(`::error::STOP BEFORE DEPLOY: Cloud Run Job serviceAccount must be a dedicated non-default service account (found: ${workerSa || "(none)"}).`);
                process.exit(1);
              }
              if (!manageFnSa) {
                console.error("::error::STOP BEFORE DEPLOY: Could not determine manageLibraryDocuments Gen2 runtime serviceAccountEmail.");
                process.exit(1);
              }
              if (workerSa === manageFnSa) {
                console.error(`::error::STOP BEFORE DEPLOY: Worker service account (${workerSa}) must be distinct from manageLibraryDocuments runtime SA (${manageFnSa}).`);
                process.exit(1);
              }
              if (normJob.taskCount !== 1 || normJob.maxRetries !== 0 || normJob.timeoutSeconds !== 600) {
                console.error(`::error::STOP BEFORE DEPLOY: Cloud Run Job execution bounds mismatch (taskCount=${String(normJob.taskCount)}, maxRetries=${String(normJob.maxRetries)}, timeoutSeconds=${String(normJob.timeoutSeconds)}).`);
                process.exit(1);
              }

              const jobImage = typeof c0.image === "string" ? c0.image.trim() : "";
              const expectedImagePrefix = `${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${JOB_NAME}`;
              if (
                !jobImage.startsWith(`${expectedImagePrefix}@sha256:`) ||
                !/^@sha256:[a-f0-9]+$/i.test(jobImage.slice(expectedImagePrefix.length))
              ) {
                console.error(`::error::STOP BEFORE DEPLOY: Cloud Run Job image must reside in ${expectedImagePrefix} with immutable @sha256 digest (found: ${jobImage || "(none)"}).`);
                process.exit(1);
              }

              // 6d. Verify image digest & 7-day fresh signature build provenance in Artifact Registry
              const imgDesc = JSON.parse(runGcloudOrFail(["artifacts", "docker", "images", "describe", jobImage, "--format=json"], "artifacts docker image describe"));
              const imgSummary = imgDesc.image_summary || imgDesc;
              const uploadIso = imgSummary.uploadTime || imgSummary.createTime || imgSummary.buildTime || (imgDesc.docker_image && (imgDesc.docker_image.uploadTime || imgDesc.docker_image.buildTime));
              const uploadMs = typeof uploadIso === "string" ? Date.parse(uploadIso) : NaN;
              const MAX_SIG_AGE_MS = 7 * 24 * 60 * 60 * 1000;
              if (!Number.isFinite(uploadMs) || Date.now() - uploadMs > MAX_SIG_AGE_MS) {
                console.error(`::error::STOP BEFORE DEPLOY: Worker container image ${jobImage} timestamp (${String(uploadIso)}) is missing or older than the 7-day ClamAV signature TTL.`);
                process.exit(1);
              }

              const cEnv = {};
              for (const item of Array.isArray(c0.env) ? c0.env : []) {
                if (item && typeof item.name === "string") cEnv[item.name] = item.value;
              }
              for (const [k, v] of Object.entries({
                NODE_ENV: "production",
                POP_CLAMAV_DB_DIR: "/var/lib/clamav",
                POP_CLAMSCAN_PATH: "/usr/bin/clamscan",
                POP_QPDF_PATH: "/usr/bin/qpdf",
              })) {
                if (cEnv[k] !== v) {
                  console.error(`::error::STOP BEFORE DEPLOY: Cloud Run Job env mismatch for ${k}: expected "${v}", found "${String(cEnv[k])}".`);
                  process.exit(1);
                }
              }
              if (Object.prototype.hasOwnProperty.call(cEnv, "POP_QUARANTINE_AV_REQUEST_ID")) {
                console.error("::error::STOP BEFORE DEPLOY: POP_QUARANTINE_AV_REQUEST_ID must never be persisted on Cloud Run Job.");
                process.exit(1);
              }

              // 6e. Job IAM non-public + caller run.jobs.runWithOverrides
              const jobIam = JSON.parse(runGcloudOrFail(["run", "jobs", "get-iam-policy", JOB_NAME, `--region=${REGION}`, `--project=${PROJECT_ID}`, "--format=json"], "run jobs get-iam-policy"));
              const projIam = JSON.parse(runGcloudOrFail(["projects", "get-iam-policy", PROJECT_ID, "--format=json"], "projects get-iam-policy"));
              const jobBindings = Array.isArray(jobIam.bindings) ? jobIam.bindings : [];
              const projBindings = Array.isArray(projIam.bindings) ? projIam.bindings : [];

              for (const b of jobBindings) {
                for (const m of Array.isArray(b.members) ? b.members : []) {
                  const norm = String(m).trim().toLowerCase();
                  if (norm === "allusers" || norm === "allauthenticatedusers" || norm.startsWith("allusers:") || norm.startsWith("allauthenticatedusers:") || norm.startsWith("domain:")) {
                    console.error(`::error::STOP BEFORE DEPLOY: Cloud Run Job has forbidden public IAM principal: ${m}`);
                    process.exit(1);
                  }
                }
              }

              const customRolePermsCache = new Map();
              function getCustomRolePerms(roleName) {
                if (customRolePermsCache.has(roleName)) return customRolePermsCache.get(roleName);
                const roleId = roleName.split("/").pop();
                const out = runGcloudOrFail(["iam", "roles", "describe", roleId, `--project=${PROJECT_ID}`, "--format=json"], `iam roles describe ${roleId}`);
                const parsed = JSON.parse(out);
                if (!parsed || !Array.isArray(parsed.includedPermissions)) {
                  console.error(`::error::STOP BEFORE DEPLOY: Custom IAM role ${roleName} returned invalid/missing includedPermissions.`);
                  process.exit(1);
                }
                const perms = parsed.includedPermissions;
                customRolePermsCache.set(roleName, perms);
                return perms;
              }

              const manageMember = `serviceAccount:${manageFnSa}`;
              const callerRoles = [
                ...jobBindings.filter((b) => Array.isArray(b.members) && b.members.includes(manageMember)).map((b) => b.role),
                ...projBindings.filter((b) => Array.isArray(b.members) && b.members.includes(manageMember)).map((b) => b.role),
              ];
              const hasOverridesPermission = callerRoles.some((r) => {
                if (["roles/run.jobsExecutorWithOverrides", "roles/run.developer", "roles/run.admin", "roles/editor", "roles/owner"].includes(r)) {
                  return true;
                }
                if (r.startsWith(`projects/${PROJECT_ID}/roles/`)) {
                  return getCustomRolePerms(r).includes("run.jobs.runWithOverrides");
                }
                return false;
              });
              if (!hasOverridesPermission) {
                console.error(`::error::STOP BEFORE DEPLOY: manageLibraryDocuments runtime SA (${manageFnSa}) lacks run.jobs.runWithOverrides on ${JOB_NAME} (roles/run.invoker alone is insufficient). Found roles: ${callerRoles.join(", ") || "(none)"}`);
                process.exit(1);
              }

              // 6f. Worker SA bucket-scoped read-only & Firestore transaction R/W & fail-closed default bucket check
              const workerMember = `serviceAccount:${workerSa}`;
              const bucketIam = JSON.parse(runGcloudOrFail(["storage", "buckets", "get-iam-policy", `gs://${BUCKET_NAME}`, "--format=json"], "bucket get-iam-policy"));
              const workerBucketRoles = (Array.isArray(bucketIam.bindings) ? bucketIam.bindings : [])
                .filter((b) => Array.isArray(b.members) && b.members.includes(workerMember))
                .map((b) => String(b.role || ""));

              const workerProjRoles = projBindings
                .filter((b) => Array.isArray(b.members) && b.members.includes(workerMember))
                .map((b) => String(b.role || ""));

              const projectWideStorageRoles = [];
              for (const r of workerProjRoles) {
                if (r.startsWith("roles/storage.") || ["roles/viewer", "roles/editor", "roles/owner"].includes(r)) {
                  projectWideStorageRoles.push(r);
                } else if (r.startsWith(`projects/${PROJECT_ID}/roles/`)) {
                  const perms = getCustomRolePerms(r);
                  if (perms.some((p) => String(p) === "*" || String(p).startsWith("storage.objects.") || String(p).startsWith("storage.buckets."))) {
                    projectWideStorageRoles.push(r);
                  }
                }
              }
              if (projectWideStorageRoles.length > 0) {
                console.error(`::error::STOP BEFORE DEPLOY: Overly broad project-wide storage role(s) (${projectWideStorageRoles.join(", ")}) on ${workerSa} do not satisfy bucket-scoped-only least privilege on ${BUCKET_NAME}.`);
                process.exit(1);
              }

              const SAFE_CUSTOM_STORAGE_READ_PERMS = new Set([
                "storage.objects.get",
                "storage.objects.list",
                "storage.buckets.get",
              ]);
              function classifyBucketStorageRole(roleName) {
                if (["roles/storage.objectViewer", "roles/storage.legacyObjectReader"].includes(roleName)) {
                  return "READ_ONLY";
                }
                if (
                  [
                    "roles/storage.objectAdmin",
                    "roles/storage.admin",
                    "roles/storage.objectUser",
                    "roles/storage.objectCreator",
                    "roles/storage.legacyBucketWriter",
                    "roles/storage.legacyBucketOwner",
                    "roles/storage.legacyObjectOwner",
                    "roles/storage.hmacKeyAdmin",
                    "roles/editor",
                    "roles/owner",
                  ].includes(roleName) ||
                  roleName.startsWith("roles/storage.")
                ) {
                  return "OVERPRIVILEGED";
                }
                if (roleName.startsWith(`projects/${PROJECT_ID}/roles/`)) {
                  const perms = getCustomRolePerms(roleName);
                  const storagePerms = perms.map((p) => String(p)).filter((p) => p === "*" || p.startsWith("storage."));
                  if (storagePerms.some((p) => !SAFE_CUSTOM_STORAGE_READ_PERMS.has(p))) {
                    return "OVERPRIVILEGED_OR_UNKNOWN";
                  }
                  return storagePerms.includes("storage.objects.get") ? "READ_ONLY" : "NONE";
                }
                return "UNKNOWN";
              }

              const bucketRoleClasses = workerBucketRoles.map((r) => ({ role: r, cls: classifyBucketStorageRole(r) }));
              const disallowedBucketRoles = bucketRoleClasses.filter((x) => x.cls === "OVERPRIVILEGED" || x.cls === "OVERPRIVILEGED_OR_UNKNOWN" || x.cls === "UNKNOWN");
              const hasBucketReadOnly = bucketRoleClasses.some((x) => x.cls === "READ_ONLY");
              if (disallowedBucketRoles.length > 0 || !hasBucketReadOnly) {
                console.error(`::error::STOP BEFORE DEPLOY: Worker SA (${workerSa}) must hold verified bucket-scoped read-only storage access on ${BUCKET_NAME} with zero write/admin/unknown roles. Found: ${workerBucketRoles.join(", ") || "(none)"}`);
                process.exit(1);
              }

              try {
                const defIamRaw = execFileSync("gcloud", ["storage", "buckets", "get-iam-policy", `gs://${FORBIDDEN_BUCKET}`, "--format=json"], { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] });
                const defIam = JSON.parse(defIamRaw);
                if (!defIam || !Array.isArray(defIam.bindings)) {
                  console.error(`::error::STOP BEFORE DEPLOY: Malformed IAM policy JSON returned for forbidden default bucket ${FORBIDDEN_BUCKET} (fail-closed).`);
                  process.exit(1);
                }
                if (defIam.bindings.some((b) => Array.isArray(b.members) && b.members.includes(workerMember))) {
                  console.error(`::error::STOP BEFORE DEPLOY: Worker SA (${workerSa}) must not have bindings on forbidden default bucket ${FORBIDDEN_BUCKET}.`);
                  process.exit(1);
                }
              } catch (err) {
                const errText = err && err.stderr ? String(err.stderr) : String(err && err.message ? err.message : err);
                const errKind = classifyGcloudError(errText);
                if (errKind !== "NOT_FOUND") {
                  console.error(`::error::STOP BEFORE DEPLOY: Unable to inspect forbidden default bucket ${FORBIDDEN_BUCKET} IAM policy (${errKind}; fail-closed): ${errText.slice(0, 180)}`);
                  process.exit(1);
                }
              }

              const hasFirestoreRw = workerProjRoles.some((r) => {
                if (["roles/datastore.user", "roles/datastore.owner", "roles/editor", "roles/owner"].includes(r)) return true;
                if (r.startsWith(`projects/${PROJECT_ID}/roles/`)) {
                  const perms = getCustomRolePerms(r);
                  return ["datastore.entities.get", "datastore.entities.create", "datastore.entities.update"].every((p) => perms.includes(p));
                }
                return false;
              });
              if (!hasFirestoreRw) {
                console.error(`::error::STOP BEFORE DEPLOY: Worker SA (${workerSa}) lacks Firestore transactional read/write role (roles/datastore.user). Found: ${workerProjRoles.join(", ") || "(none)"}`);
                process.exit(1);
              }

              fs.appendFileSync(process.env.GITHUB_ENV, `VERIFIED_AV_WORKER_IMAGE=${jobImage}\n`);
              fs.appendFileSync(process.env.GITHUB_ENV, `VERIFIED_AV_WORKER_SA=${workerSa}\n`);
              fs.appendFileSync(process.env.GITHUB_ENV, `VERIFIED_MANAGE_FN_SA=${manageFnSa}\n`);
              console.log(`Verified live Cloud Run AV Worker prerequisites: schema=${normJob.schemaVersion}, job=${normJob.jobIdentifier}, image=${jobImage} (uploaded=${uploadIso}), workerSA=${workerSa}, manageFnSA=${manageFnSa} (run.jobs.runWithOverrides verified).`);
            PREFLIGHT_AV_ENABLE_EOF
          fi

      - name: Write Transient Project-Scoped Functions Dotenv (Runner Only, Post-Preflight)
        id: write_transient_dotenv
        env:
          AV_EXECUTION_MODE: ${{ inputs.av_execution_mode }}
        run: |
          set -euo pipefail
          DOTENV_PATH="functions/.env.promiseofplanet-bb325"
          if [ -e "${DOTENV_PATH}" ]; then
            echo "::error::${DOTENV_PATH} already existed unexpectedly."
            exit 1
          fi

          node << 'WRITE_DOTENV_EOF'
            const fs = require("node:fs");
            const mode = process.env.AV_EXECUTION_MODE;
            const dotenvPath = "functions/.env.promiseofplanet-bb325";

            const lines = [
              "POP_LIBRARY_REVIEW_WORKBENCH_ENABLED=true",
              "POP_LIBRARY_HUMAN_CASE_REVIEW_ENABLED=true",
              "POP_LIBRARY_CATALOG_HANDOFF_ENABLED=true",
              "POP_LIBRARY_RIGHTS_DECISION_ENABLED=true",
              "POP_LIBRARY_CASE_ALIGNMENT_ENABLED=true",
              "POP_LIBRARY_BINARY_SAFETY_CASE_ENABLED=true",
              "POP_LIBRARY_ISOLATED_INSPECTION_REQUEST_ENABLED=true",
              "POP_LIBRARY_REVIEWED_SOURCE_RELEASE_ENABLED=true",
              "POP_LIBRARY_PUBLISHED_BINARY_RELEASE_ENABLED=true",
              "POP_LIBRARY_PUBLISHED_BINARY_DOWNLOAD_URL=https://us-central1-promiseofplanet-bb325.cloudfunctions.net/libraryPublishedBinaryDownload",
            ];

            if (mode === "enabled") {
              lines.push(
                "POP_LIBRARY_AV_EXECUTION_ENABLED=true",
                "POP_QUARANTINE_AV_JOB_PROJECT_ID=promiseofplanet-bb325",
                "POP_QUARANTINE_AV_JOB_REGION=us-central1",
                "POP_QUARANTINE_AV_JOB_NAME=pop-library-quarantine-av-worker"
              );
            } else if (mode === "disabled") {
              lines.push("POP_LIBRARY_AV_EXECUTION_ENABLED=false");
            } else {
              console.error(`::error::Unexpected AV_EXECUTION_MODE=${String(mode)}`);
              process.exit(1);
            }

            fs.writeFileSync(dotenvPath, lines.join("\n") + "\n", "utf8");

            const rawLines = fs.readFileSync(dotenvPath, "utf8").trim().split(/\r?\n/);
            if (rawLines.length !== lines.length || !lines.every((line, idx) => rawLines[idx] === line)) {
              console.error("::error::Transient functions/.env.promiseofplanet-bb325 content mismatch.");
              process.exit(1);
            }
            if (mode === "disabled") {
              const hasJobVars = rawLines.some((l) => l.startsWith("POP_QUARANTINE_AV_JOB_"));
              if (hasJobVars) {
                console.error("::error::POP_QUARANTINE_AV_JOB_* must never be written in av_execution_mode=disabled.");
                process.exit(1);
              }
            }
            if (fs.existsSync("dist/.env") || fs.existsSync("dist/.env.promiseofplanet-bb325")) {
              console.error("::error::Dotenv file must never exist inside dist/.");
              process.exit(1);
            }
            console.log(`Created and verified transient ${dotenvPath} (mode=${mode}, lines=${rawLines.length}; note: Firebase CLI applies this project-scoped dotenv across all deployed functions in the invocation).`);
          WRITE_DOTENV_EOF

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Execute Single Live Firebase Deployment (functions:manageLibraryDocuments,functions:getPublicLibrary,functions:libraryPublishedBinaryDownload,hosting)
        id: firebase_one_shot_deploy
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [ "${CURRENT_SHA}" != "${PINNED_JOB_SHA}" ]; then
            echo "::error::Commit identity drifted before deploy (${CURRENT_SHA} != ${PINNED_JOB_SHA})."
            exit 1
          fi
          echo "DEPLOY_ATTEMPTED=true" >> "$GITHUB_ENV"
          firebase deploy --project promiseofplanet-bb325 --only "functions:manageLibraryDocuments,functions:getPublicLibrary,functions:libraryPublishedBinaryDownload,hosting" --non-interactive

      - name: Remove Transient Functions Dotenv File
        if: always()
        run: |
          rm -f functions/.env.promiseofplanet-bb325

      - name: Post-Deploy Readback of manageLibraryDocuments (Strict GEN_2, Region, State, Mode-Exact Runtime Env & GEMINI_API_KEY Secret Binding)
        id: post_deploy_readback_manage_library
        env:
          AV_EXECUTION_MODE: ${{ inputs.av_execution_mode }}
        run: |
          set -euo pipefail
          gcloud functions describe manageLibraryDocuments \
            --gen2 \
            --region="${EXPECTED_FUNCTION_REGION}" \
            --project="${FIREBASE_PROJECT_ID}" \
            --format=json > /tmp/manage_library_fn_post.json

          node << 'READBACK_MANAGE_EOF'
            const fs = require("node:fs");
            const mode = process.env.AV_EXECUTION_MODE;
            const fn = JSON.parse(fs.readFileSync("/tmp/manage_library_fn_post.json", "utf8"));
            if (typeof fn.name !== "string" || !fn.name.endsWith("projects/promiseofplanet-bb325/locations/us-central1/functions/manageLibraryDocuments")) {
              console.error("::error::Post-deploy manageLibraryDocuments name/region mismatch: " + String(fn.name));
              process.exit(1);
            }
            if (fn.environment !== "GEN_2") {
              console.error("::error::Post-deploy manageLibraryDocuments environment must strictly equal \"GEN_2\" (found: " + String(fn.environment) + ").");
              process.exit(1);
            }
            if (fn.state !== "ACTIVE") {
              console.error("::error::Post-deploy manageLibraryDocuments state must equal \"ACTIVE\" (found: " + String(fn.state) + ").");
              process.exit(1);
            }

            const serviceConfig = fn.serviceConfig || {};
            const envVars = serviceConfig.environmentVariables || {};
            const expectedFlags = {
              POP_LIBRARY_REVIEW_WORKBENCH_ENABLED: "true",
              POP_LIBRARY_HUMAN_CASE_REVIEW_ENABLED: "true",
              POP_LIBRARY_CATALOG_HANDOFF_ENABLED: "true",
              POP_LIBRARY_RIGHTS_DECISION_ENABLED: "true",
              POP_LIBRARY_CASE_ALIGNMENT_ENABLED: "true",
              POP_LIBRARY_BINARY_SAFETY_CASE_ENABLED: "true",
              POP_LIBRARY_ISOLATED_INSPECTION_REQUEST_ENABLED: "true",
              POP_LIBRARY_REVIEWED_SOURCE_RELEASE_ENABLED: "true",
              POP_LIBRARY_PUBLISHED_BINARY_RELEASE_ENABLED: "true",
              POP_LIBRARY_PUBLISHED_BINARY_DOWNLOAD_URL: "https://us-central1-promiseofplanet-bb325.cloudfunctions.net/libraryPublishedBinaryDownload",
              POP_LIBRARY_AV_EXECUTION_ENABLED: mode === "enabled" ? "true" : "false",
            };

            for (const [k, expectedVal] of Object.entries(expectedFlags)) {
              if (envVars[k] !== expectedVal) {
                console.error(`::error::Post-deploy readback mismatch on manageLibraryDocuments for ${k}: expected "${expectedVal}", found "${String(envVars[k])}"`);
                process.exit(1);
              }
            }

            const jobEnvKeys = [
              ["POP_QUARANTINE_AV_JOB_PROJECT_ID", "promiseofplanet-bb325"],
              ["POP_QUARANTINE_AV_JOB_REGION", "us-central1"],
              ["POP_QUARANTINE_AV_JOB_NAME", "pop-library-quarantine-av-worker"],
            ];
            for (const [k, expectedVal] of jobEnvKeys) {
              if (mode === "enabled") {
                if (envVars[k] !== expectedVal) {
                  console.error(`::error::Post-deploy readback mismatch on manageLibraryDocuments for ${k}: expected "${expectedVal}", found "${String(envVars[k])}"`);
                  process.exit(1);
                }
              } else {
                if (envVars[k] !== undefined) {
                  console.error(`::error::Post-deploy readback on manageLibraryDocuments found unexpected ${k} while av_execution_mode=disabled.`);
                  process.exit(1);
                }
              }
            }

            const secretEnvVars = Array.isArray(serviceConfig.secretEnvironmentVariables)
              ? serviceConfig.secretEnvironmentVariables
              : [];
            if (!secretEnvVars.some((s) => s && s.key === "GEMINI_API_KEY")) {
              console.error("::error::Post-deploy readback failed: GEMINI_API_KEY secret binding is missing on manageLibraryDocuments.");
              process.exit(1);
            }

            console.log(`Post-deploy readback verified manageLibraryDocuments (GEN_2, ACTIVE, us-central1, mode=${mode}, POP_LIBRARY_AV_EXECUTION_ENABLED=${expectedFlags.POP_LIBRARY_AV_EXECUTION_ENABLED}, GEMINI_API_KEY bound).`);
          READBACK_MANAGE_EOF

