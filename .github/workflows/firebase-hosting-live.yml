name: Firebase Hosting Live Deploy
on:
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Verify Main Branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::This workflow can only be run on the main branch."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Validate Editorial Image Upload URL
        env:
          UPLOAD_URL: ${{ vars.VITE_EDITORIAL_NEWS_IMAGE_UPLOAD_URL }}
        run: |
          if [ -z "$UPLOAD_URL" ]; then
            echo "::error::Repository variable VITE_EDITORIAL_NEWS_IMAGE_UPLOAD_URL is missing or empty. Please configure it with the deployed Cloud Functions HTTPS URL."
            exit 1
          fi
          node -e '
            const raw = process.env.UPLOAD_URL;
            if (typeof raw !== "string" || !raw.trim()) {
              console.error("::error::VITE_EDITORIAL_NEWS_IMAGE_UPLOAD_URL is empty.");
              process.exit(1);
            }
            const trimmed = raw.trim();
            if (trimmed !== raw || /\s/.test(trimmed)) {
              console.error("::error::VITE_EDITORIAL_NEWS_IMAGE_UPLOAD_URL must not contain leading, trailing, or internal whitespace.");
              process.exit(1);
            }
            if (trimmed.includes("?") || trimmed.includes("#")) {
              console.error("::error::VITE_EDITORIAL_NEWS_IMAGE_UPLOAD_URL must not include query parameters or URL fragments.");
              process.exit(1);
            }
            let parsed;
            try {
              parsed = new URL(trimmed);
            } catch (err) {
              console.error("::error::VITE_EDITORIAL_NEWS_IMAGE_UPLOAD_URL is not a syntactically valid URL: " + err.message);
              process.exit(1);
            }
            if (parsed.protocol !== "https:") {
              console.error("::error::VITE_EDITORIAL_NEWS_IMAGE_UPLOAD_URL must use the https protocol. Received: " + parsed.protocol);
              process.exit(1);
            }
            if (!parsed.hostname || parsed.hostname.length === 0) {
              console.error("::error::VITE_EDITORIAL_NEWS_IMAGE_UPLOAD_URL must have a valid hostname.");
              process.exit(1);
            }
            console.log("Validated VITE_EDITORIAL_NEWS_IMAGE_UPLOAD_URL: " + parsed.origin + parsed.pathname);
          '
      - name: Validate Editorial Image Preview URL
        env:
          PREVIEW_URL: ${{ vars.VITE_EDITORIAL_IMAGE_PREVIEW_URL }}
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::Repository variable VITE_EDITORIAL_IMAGE_PREVIEW_URL is missing or empty. Please configure it with the deployed Cloud Functions HTTPS URL."
            exit 1
          fi
          node -e '
            const raw = process.env.PREVIEW_URL;
            if (typeof raw !== "string" || !raw.trim()) {
              console.error("::error::VITE_EDITORIAL_IMAGE_PREVIEW_URL is empty.");
              process.exit(1);
            }
            const trimmed = raw.trim();
            if (trimmed !== raw || /\s/.test(trimmed)) {
              console.error("::error::VITE_EDITORIAL_IMAGE_PREVIEW_URL must not contain leading, trailing, or internal whitespace.");
              process.exit(1);
            }
            if (trimmed.includes("?") || trimmed.includes("#")) {
              console.error("::error::VITE_EDITORIAL_IMAGE_PREVIEW_URL must not include query parameters or URL fragments.");
              process.exit(1);
            }
            let parsed;
            try {
              parsed = new URL(trimmed);
            } catch (err) {
              console.error("::error::VITE_EDITORIAL_IMAGE_PREVIEW_URL is not a syntactically valid URL: " + err.message);
              process.exit(1);
            }
            if (parsed.protocol !== "https:") {
              console.error("::error::VITE_EDITORIAL_IMAGE_PREVIEW_URL must use the https protocol. Received: " + parsed.protocol);
              process.exit(1);
            }
            if (!parsed.hostname || parsed.hostname.length === 0) {
              console.error("::error::VITE_EDITORIAL_IMAGE_PREVIEW_URL must have a valid hostname.");
              process.exit(1);
            }
            if (parsed.username || parsed.password) {
              console.error("::error::VITE_EDITORIAL_IMAGE_PREVIEW_URL must not contain embedded credentials.");
              process.exit(1);
            }
            if (parsed.search || parsed.hash) {
              console.error("::error::VITE_EDITORIAL_IMAGE_PREVIEW_URL must not include query parameters or URL fragments.");
              process.exit(1);
            }
            console.log("Validated VITE_EDITORIAL_IMAGE_PREVIEW_URL: " + parsed.origin + parsed.pathname);
          '
      - name: Validate Public Editorial Image Delivery URL
        env:
          PUBLIC_DELIVERY_URL: ${{ vars.VITE_PUBLIC_EDITORIAL_IMAGE_DELIVERY_URL }}
        run: |
          if [ -z "$PUBLIC_DELIVERY_URL" ]; then
            echo "::error::Repository variable VITE_PUBLIC_EDITORIAL_IMAGE_DELIVERY_URL is missing or empty. Please configure it with the deployed Cloud Functions HTTPS URL."
            exit 1
          fi
          node -e '
            const raw = process.env.PUBLIC_DELIVERY_URL;
            if (typeof raw !== "string" || !raw.trim()) {
              console.error("::error::VITE_PUBLIC_EDITORIAL_IMAGE_DELIVERY_URL is empty.");
              process.exit(1);
            }
            const trimmed = raw.trim();
            if (trimmed !== raw || /\s/.test(trimmed)) {
              console.error("::error::VITE_PUBLIC_EDITORIAL_IMAGE_DELIVERY_URL must not contain leading, trailing, or internal whitespace.");
              process.exit(1);
            }
            if (trimmed.includes("?") || trimmed.includes("#")) {
              console.error("::error::VITE_PUBLIC_EDITORIAL_IMAGE_DELIVERY_URL must not include query parameters or URL fragments.");
              process.exit(1);
            }
            let parsed;
            try {
              parsed = new URL(trimmed);
            } catch (err) {
              console.error("::error::VITE_PUBLIC_EDITORIAL_IMAGE_DELIVERY_URL is not a syntactically valid URL: " + err.message);
              process.exit(1);
            }
            if (parsed.protocol !== "https:") {
              console.error("::error::VITE_PUBLIC_EDITORIAL_IMAGE_DELIVERY_URL must use the https protocol. Received: " + parsed.protocol);
              process.exit(1);
            }
            if (!parsed.hostname || parsed.hostname.length === 0 || !parsed.hostname.includes(".")) {
              console.error("::error::VITE_PUBLIC_EDITORIAL_IMAGE_DELIVERY_URL must have a valid hostname.");
              process.exit(1);
            }
            if (parsed.username || parsed.password) {
              console.error("::error::VITE_PUBLIC_EDITORIAL_IMAGE_DELIVERY_URL must not contain embedded credentials.");
              process.exit(1);
            }
            if (parsed.search || parsed.hash) {
              console.error("::error::VITE_PUBLIC_EDITORIAL_IMAGE_DELIVERY_URL must not include query parameters or URL fragments.");
              process.exit(1);
            }
            const lowerUrl = trimmed.toLowerCase();
            const lowerHost = parsed.hostname.toLowerCase();
            if (
              lowerHost === "localhost" ||
              lowerHost === "127.0.0.1" ||
              lowerHost === "0.0.0.0" ||
              lowerHost === "[::1]" ||
              lowerHost.endsWith(".example.com") ||
              lowerHost === "example.com" ||
              lowerHost.endsWith(".invalid") ||
              lowerHost.endsWith(".local") ||
              lowerUrl.includes("placeholder") ||
              lowerUrl.includes("changeme") ||
              lowerUrl.includes("todo") ||
              lowerUrl.includes("<") ||
              lowerUrl.includes(">")
            ) {
              console.error("::error::VITE_PUBLIC_EDITORIAL_IMAGE_DELIVERY_URL must not use a placeholder, local, or invented URL.");
              process.exit(1);
            }
            console.log("Validated VITE_PUBLIC_EDITORIAL_IMAGE_DELIVERY_URL: " + parsed.origin + parsed.pathname);
          '
      - name: Validate Library Quarantine Upload Configuration
        env:
          LIBRARY_UPLOAD_ENABLED: ${{ vars.VITE_LIBRARY_QUARANTINE_UPLOAD_ENABLED }}
          LIBRARY_UPLOAD_ENDPOINT_URL: ${{ vars.VITE_LIBRARY_QUARANTINE_UPLOAD_ENDPOINT_URL }}
        run: |
          if [ -z "$LIBRARY_UPLOAD_ENABLED" ]; then
            echo "::error::Repository variable VITE_LIBRARY_QUARANTINE_UPLOAD_ENABLED is missing or empty."
            exit 1
          fi
          if [ -z "$LIBRARY_UPLOAD_ENDPOINT_URL" ]; then
            echo "::error::Repository variable VITE_LIBRARY_QUARANTINE_UPLOAD_ENDPOINT_URL is missing or empty."
            exit 1
          fi
          node -e '
            const rawEnabled = process.env.LIBRARY_UPLOAD_ENABLED;
            const rawUrl = process.env.LIBRARY_UPLOAD_ENDPOINT_URL;
            const expectedUrl = "https://us-central1-promiseofplanet-bb325.cloudfunctions.net/libraryQuarantineUploadEndpoint";

            if (typeof rawEnabled !== "string" || rawEnabled.trim() !== rawEnabled || /\s/.test(rawEnabled)) {
              console.error("::error::VITE_LIBRARY_QUARANTINE_UPLOAD_ENABLED must not contain leading, trailing, or internal whitespace.");
              process.exit(1);
            }
            if (rawEnabled !== "true") {
              console.error("::error::VITE_LIBRARY_QUARANTINE_UPLOAD_ENABLED must equal exactly \"true\".");
              process.exit(1);
            }

            if (typeof rawUrl !== "string" || rawUrl.trim() !== rawUrl || /\s/.test(rawUrl)) {
              console.error("::error::VITE_LIBRARY_QUARANTINE_UPLOAD_ENDPOINT_URL must not contain leading, trailing, or internal whitespace.");
              process.exit(1);
            }
            if (rawUrl.includes("?") || rawUrl.includes("#")) {
              console.error("::error::VITE_LIBRARY_QUARANTINE_UPLOAD_ENDPOINT_URL must not include query parameters or URL fragments.");
              process.exit(1);
            }

            let parsed;
            try {
              parsed = new URL(rawUrl);
            } catch (err) {
              console.error("::error::VITE_LIBRARY_QUARANTINE_UPLOAD_ENDPOINT_URL is not a syntactically valid URL: " + err.message);
              process.exit(1);
            }
            if (parsed.protocol !== "https:" || parsed.username || parsed.password || parsed.search || parsed.hash) {
              console.error("::error::VITE_LIBRARY_QUARANTINE_UPLOAD_ENDPOINT_URL must be a clean https URL without credentials, query parameters, or fragments.");
              process.exit(1);
            }
            if (rawUrl !== expectedUrl) {
              console.error("::error::VITE_LIBRARY_QUARANTINE_UPLOAD_ENDPOINT_URL must equal exactly \"" + expectedUrl + "\".");
              process.exit(1);
            }

            console.log("Validated VITE_LIBRARY_QUARANTINE_UPLOAD_ENABLED=true and VITE_LIBRARY_QUARANTINE_UPLOAD_ENDPOINT_URL=" + expectedUrl);
          '
      - run: npx vite build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_EDITORIAL_NEWS_IMAGE_UPLOAD_URL: ${{ vars.VITE_EDITORIAL_NEWS_IMAGE_UPLOAD_URL }}
          VITE_EDITORIAL_IMAGE_PREVIEW_URL: ${{ vars.VITE_EDITORIAL_IMAGE_PREVIEW_URL }}
          VITE_PUBLIC_EDITORIAL_IMAGE_DELIVERY_URL: ${{ vars.VITE_PUBLIC_EDITORIAL_IMAGE_DELIVERY_URL }}
          VITE_LIBRARY_QUARANTINE_UPLOAD_ENABLED: ${{ vars.VITE_LIBRARY_QUARANTINE_UPLOAD_ENABLED }}
          VITE_LIBRARY_QUARANTINE_UPLOAD_ENDPOINT_URL: ${{ vars.VITE_LIBRARY_QUARANTINE_UPLOAD_ENDPOINT_URL }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROMISEOFPLANET_BB325 }}'
          channelId: live
          projectId: promiseofplanet-bb325
