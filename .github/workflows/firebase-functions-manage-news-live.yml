name: Deploy News Rights manageNews Live

# PREREQUISITE NOTICE FOR PROJECT OWNER:
# Before triggering this workflow, ensure that the Google Cloud Artifact Registry cleanup policy
# for Cloud Functions Gen 2 container images has been configured in project 'promiseofplanet-bb325'
# to automatically delete stale container build layers and prevent storage quota exhaustion.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_manage_news_function:
    name: Deploy manageNews
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Verify Main Branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::This workflow can only be run on the main branch."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Service Account Credential
        env:
          CREDENTIAL_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROMISEOFPLANET_BB325 }}
        run: |
          if [ -z "$CREDENTIAL_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_PROMISEOFPLANET_BB325 secret is empty or missing."
            exit 1
          fi
          node -e '
            const raw = process.env.CREDENTIAL_JSON;
            let cred;
            try {
              cred = JSON.parse(raw);
            } catch (err) {
              console.error("::error::Failed to parse credential JSON.");
              process.exit(1);
            }
            if (cred.type !== "service_account") {
              console.error("::error::Credential is not a service_account (type: " + cred.type + ")");
              process.exit(1);
            }
            if (cred.project_id !== "promiseofplanet-bb325") {
              console.error("::error::Credential project_id mismatch. Expected promiseofplanet-bb325, found: " + cred.project_id);
              process.exit(1);
            }
            console.log("Verified service-account credential for project: " + cred.project_id);
          '

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROMISEOFPLANET_BB325 }}

      - name: Install Functions Dependencies
        working-directory: functions
        run: npm ci

      - name: Build Functions
        working-directory: functions
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy manageNews Function to Firebase
        run: |
          firebase deploy --project promiseofplanet-bb325 --only "functions:manageNews" --non-interactive
