name: Deploy PEIA Gateway Functions Live

# PREREQUISITE NOTICE FOR PROJECT OWNER:
# 1. Before triggering this workflow, ensure that the Google Cloud Artifact Registry cleanup policy
#    for Cloud Functions Gen 2 container images has been configured in project 'promiseofplanet-bb325'
#    to automatically delete stale container build layers and prevent storage quota exhaustion.
# 2. SEPARATE AUTHORIZATION REQUIRED: This workflow must NOT be dispatched without separate,
#    explicit owner authorization and review of external worker runtime security.
# 3. SCOPE INTEGRITY: This workflow deploys ONLY:
#    - functions:peiaPendingTaskGateway
#    - functions:peiaAdvisoryResultSubmission
#    - functions:peiaNonAdvisoryOutcomeSubmission
#    ('--only "functions:peiaPendingTaskGateway,functions:peiaAdvisoryResultSubmission,functions:peiaNonAdvisoryOutcomeSubmission"').
#    No Firestore rules, Storage rules, Firestore indexes, Hosting assets, or unrelated functions
#    are deployed.
# 4. ROLLBACK SAFETY: Reverting source exports does NOT automatically undeploy active Cloud Functions
#    in Google Cloud / Firebase. Rollback requires an explicitly authorized operational action.
# 5. CREDENTIAL SAFETY: Never echo, log, or expose secret values or service account credentials.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-peia-gateways-live
  cancel-in-progress: false

jobs:
  deploy_peia_gateways:
    name: Deploy PEIA Gateway Functions
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Verify Main Branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::This workflow can only be run on the main branch."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Service Account Credential
        env:
          CREDENTIAL_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROMISEOFPLANET_BB325 }}
        run: |
          if [ -z "$CREDENTIAL_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_PROMISEOFPLANET_BB325 secret is empty or missing."
            exit 1
          fi
          node -e '
            const raw = process.env.CREDENTIAL_JSON;
            let cred;
            try {
              cred = JSON.parse(raw);
            } catch (err) {
              console.error("::error::Failed to parse credential JSON.");
              process.exit(1);
            }
            if (cred.type !== "service_account") {
              console.error("::error::Credential is not a service_account (type: " + cred.type + ")");
              process.exit(1);
            }
            if (cred.project_id !== "promiseofplanet-bb325") {
              console.error("::error::Credential project_id mismatch. Expected promiseofplanet-bb325, found: " + cred.project_id);
              process.exit(1);
            }
            console.log("Verified service-account credential for project: " + cred.project_id);
          '

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROMISEOFPLANET_BB325 }}

      - name: Verify Required Function Source Exports
        working-directory: functions
        run: |
          node -e '
            const fs = require("fs");
            const indexCode = fs.readFileSync("src/index.ts", "utf8");
            const requiredExports = [
              "peiaPendingTaskGateway",
              "peiaAdvisoryResultSubmission",
              "peiaNonAdvisoryOutcomeSubmission"
            ];
            for (const exp of requiredExports) {
              if (!indexCode.includes(exp)) {
                console.error("::error::Missing required export in functions/src/index.ts: " + exp);
                process.exit(1);
              }
            }
            console.log("Verified all 3 PEIA gateway exports exist in functions/src/index.ts: " + requiredExports.join(", "));
          '

      - name: Install Functions Dependencies
        working-directory: functions
        run: npm ci

      - name: Build Functions
        working-directory: functions
        run: npm run build

      - name: Verify Compiled Function Exports
        working-directory: functions
        run: |
          node -e '
            const lib = require("./lib/index.js");
            const requiredFunctions = [
              "peiaPendingTaskGateway",
              "peiaAdvisoryResultSubmission",
              "peiaNonAdvisoryOutcomeSubmission"
            ];
            for (const fn of requiredFunctions) {
              if (typeof lib[fn] !== "function") {
                console.error("::error::Compiled lib/index.js is missing required function: " + fn);
                process.exit(1);
              }
            }
            console.log("Verified all 3 PEIA gateway functions successfully compiled in lib/index.js: " + requiredFunctions.join(", "));
          '

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy PEIA Gateway Functions to Firebase
        run: |
          firebase deploy --project promiseofplanet-bb325 --only "functions:peiaPendingTaskGateway,functions:peiaAdvisoryResultSubmission,functions:peiaNonAdvisoryOutcomeSubmission" --non-interactive

      - name: Generate Deployment Summary
        if: always()
        run: |
          echo "### PEIA Gateway Functions Deployment Summary 🛰️" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Project:** \`promiseofplanet-bb325\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref:** \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed Functions:**" >> $GITHUB_STEP_SUMMARY
          echo "  - \`functions:peiaPendingTaskGateway\`" >> $GITHUB_STEP_SUMMARY
          echo "  - \`functions:peiaAdvisoryResultSubmission\`" >> $GITHUB_STEP_SUMMARY
          echo "  - \`functions:peiaNonAdvisoryOutcomeSubmission\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Status:** \`${{ job.status }}\`" >> $GITHUB_STEP_SUMMARY
